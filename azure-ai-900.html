s": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-105", "question": "Which Azure service is specifically designed for analyzing video content?", "options": ["Azure AI Video Indexer", "Azure Media Player", "Azure Stream Analytics", "Azure Blob Storage"], "correctAnswer": 0, "explanation": "Azure AI Video Indexer (formerly Azure Video Analyzer for Media) uses AI to extract insights from videos, including transcription, face detection, object detection, and content moderation. It automatically analyzes video and audio content to make them searchable. Media Player, Stream Analytics, and Blob Storage do not provide AI-based video insight extraction.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-106", "question": "In image classification, what is a \"confidence score\"?", "options": ["The number of images used to train the model", "A value indicating how certain the model is about its prediction", "The processing time required to classify an image", "The resolution quality of the input image"], "correctAnswer": 1, "explanation": "A confidence score (or probability score) indicates the model's certainty about its prediction. It is typically expressed as a percentage or decimal between 0 and 1. Higher scores indicate greater confidence that the prediction is correct.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-107", "question": "What is the main difference between image classification and object detection?", "options": ["Image classification works on videos while object detection works on images", "Image classification labels the entire image while object detection locates specific objects within the image", "Object detection is faster than image classification", "Image classification requires more training data than object detection"], "correctAnswer": 1, "explanation": "Image classification assigns a single label to an entire image (e.g., \"this is a picture of a cat\"). Object detection goes further by identifying multiple objects in an image and providing their bounding box coordinates (e.g., \"cat at coordinates x,y with width w and height h\").", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-108", "question": "Which API feature of Azure AI Vision can extract printed and handwritten text from images?", "options": ["Image Analysis API", "Read API", "Face API", "Custom Vision API"], "correctAnswer": 1, "explanation": "The Read API is Azure AI Vision's OCR (Optical Character Recognition) feature that extracts printed and handwritten text from images and documents. It supports multiple languages and can handle dense text, multi-page documents, and various text styles.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-109", "question": "An older study guide recommends Azure AI Vision spatial analysis for tracking how shoppers move through store aisles. What is the status of that feature in 2026?", "options": ["Generally available in every Azure region", "Retired by Microsoft on March 30, 2025", "Available only through Azure Face identification", "Replaced by Azure AI Translator"], "correctAnswer": 1, "explanation": "Microsoft retired Azure AI Vision Spatial Analysis, the feature that analyzed people's presence and movement in camera video, on March 30, 2025, so a 2026 solution cannot use it. Face identification identifies people rather than tracking anonymous movement, and Translator works on text.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-110", "question": "In Azure Custom Vision, what are the two main types of projects you can create?", "options": ["Classification and Regression", "Classification and Object Detection", "Detection and Segmentation", "Recognition and Analysis"], "correctAnswer": 1, "explanation": "Azure Custom Vision supports two main project types: Image Classification (assigns a label to an entire image) and Object Detection (identifies objects and their locations within an image using bounding boxes). These cover the majority of custom computer vision use cases.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-111", "question": "What is the purpose of face verification in Azure Face Service?", "options": ["To detect all faces in an image", "To determine if two faces belong to the same person", "To identify a person from a large database of faces", "To analyze facial expressions and emotions"], "correctAnswer": 1, "explanation": "Face verification (also called face comparison) checks whether two faces belong to the same person. It takes two face images as input and returns a similarity score indicating the likelihood they represent the same individual. This is a 1:1 comparison.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-112", "question": "A company needs to extract structured data from scanned invoices including vendor name, date, line items, and total amount. Which solution should they implement?", "options": ["Azure AI Vision Read API", "Azure AI Document Intelligence (formerly Form Recognizer)", "Azure Custom Vision", "Azure Face Service"], "correctAnswer": 1, "explanation": "Azure AI Document Intelligence (formerly Form Recognizer) is specifically designed to extract structured data from documents like invoices, receipts, and forms. It understands document layouts and can identify key-value pairs, tables, and specific fields without requiring extensive custom training.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-113", "question": "What is the difference between facial detection and facial recognition?", "options": ["Detection finds faces; recognition identifies who the person is", "Detection requires more computing power than recognition", "Recognition only works on photos while detection works on video", "There is no difference; they are the same technology"], "correctAnswer": 0, "explanation": "Facial detection locates faces in an image (finding \"where\" faces are), while facial recognition identifies who the person is by comparing against a database of known faces (finding \"who\" the person is). Detection is a prerequisite for recognition.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-114", "question": "When training a custom image classification model, what is the minimum recommended number of images per tag for Azure Custom Vision?", "options": ["5 images per tag", "15 images per tag", "50 images per tag", "100 images per tag"], "correctAnswer": 2, "explanation": "Azure Custom Vision recommends at least 50 images per tag for reliable training, though the service can work with as few as 15 images per tag. More images generally produce better model accuracy, especially when the images vary in background, lighting, and object positioning.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-115", "question": "Which iteration of a Custom Vision model should be used in production?", "options": ["The first iteration that achieved 50% accuracy", "The iteration with the highest precision and recall metrics", "Always the most recent iteration regardless of metrics", "The default iteration selected automatically by the service"], "correctAnswer": 1, "explanation": "You should select the iteration with the best performance metrics (precision, recall, and AP - Average Precision) for production use. Azure Custom Vision allows you to mark a specific iteration as the default for prediction endpoints, regardless of whether it is the most recent.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-116", "question": "What capability does Azure Video Indexer provide for video content?", "options": ["Video compression and format conversion", "Automatic transcription, face detection, and content moderation", "Real-time video streaming and broadcasting", "Video editing and special effects"], "correctAnswer": 1, "explanation": "Azure Video Indexer uses AI to extract deep insights from video and audio content, including automatic transcription, face detection and identification, emotion detection, keyframe extraction, scene segmentation, and content moderation for inappropriate material.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-117", "question": "A security system needs to detect when people enter a restricted area and send alerts. Which computer vision capability is most appropriate?", "options": ["Image classification", "Object detection with region of interest", "Facial recognition only", "OCR text extraction"], "correctAnswer": 1, "explanation": "Object detection with a defined region of interest (ROI) is ideal for this scenario. It can detect people (objects) entering specific zones in video frames. Azure AI Vision's Spatial Analysis feature once packaged this kind of zone alert for live video, but Microsoft retired it on March 30, 2025.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-118", "question": "What does \"bounding box\" mean in object detection?", "options": ["The storage container for training images", "The rectangular coordinates defining where an object is located in an image", "The file format used to save detected objects", "The confidence threshold for accepting detection results"], "correctAnswer": 1, "explanation": "A bounding box is a rectangle defined by coordinates (typically x, y, width, height) that surrounds and identifies the location of a detected object in an image. Object detection models return bounding boxes along with class labels and confidence scores for each detected object.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-119", "question": "Which metric measures the proportion of actual positive cases that were correctly identified by a computer vision model?", "options": ["Precision", "Recall", "F1 Score", "Accuracy"], "correctAnswer": 1, "explanation": "Recall (also called sensitivity or true positive rate) measures the proportion of actual positives that were correctly identified. It answers: \"Of all the actual positive cases, how many did the model correctly find?\" High recall means few false negatives.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-120", "question": "What is the Azure AI Vision Image Analysis API capable of detecting?", "options": ["Only text in images", "Objects, people, scenes, activities, and visual content", "Only human faces", "Video content only"], "correctAnswer": 1, "explanation": "The Azure AI Vision Image Analysis API provides comprehensive image understanding including object detection, people detection, scene recognition, activity detection, image tagging, description generation, and adult/racy content detection. It offers a unified endpoint for multiple visual analysis tasks.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-121", "question": "A manufacturing company needs to detect microscopic defects on circuit boards with 99% accuracy. The defects vary in appearance and are rare events. What approach should they take?", "options": ["Use Azure AI Vision's built-in object detection without training", "Use Azure Custom Vision with anomaly detection and carefully balanced training data", "Use Azure Face Service to identify the operators", "Use the Read API to extract text from the circuit boards"], "correctAnswer": 1, "explanation": "For specialized defect detection with high accuracy requirements, Azure Custom Vision is appropriate. However, rare events (anomalies) require careful training data preparation, potentially using anomaly detection techniques or balancing techniques like oversampling the minority class. The built-in Azure AI Vision services are not trained for specific manufacturing defects.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-122", "question": "A team needs scene-level insights such as transcripts, detected faces, and on-screen text from hours of recorded store video. Which Azure service is designed for this?", "options": ["The OCR Read API applied to single frames only", "Azure AI Video Indexer", "Azure AI Translator", "Azure AI Language sentiment analysis"], "correctAnswer": 1, "explanation": "Azure AI Video Indexer extracts audio and visual insights such as transcripts, faces, scenes, and on-screen text (OCR) from recorded video. OCR on single frames misses the audio and timeline, Translator works on text, and sentiment analysis scores text opinions. Azure AI Vision's Spatial Analysis edge container, once used for live people counting, was retired on March 30, 2025.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "hard", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-123", "question": "A company trained a Custom Vision model that shows 95% precision but only 60% recall for detecting product defects. What does this indicate and how should they improve it?", "options": ["The model is finding too many false positives; increase training data variety", "The model is missing many actual defects; they need to add more positive examples and reduce the detection threshold", "The model is perfect; no changes are needed", "They should switch to facial recognition instead"], "correctAnswer": 1, "explanation": "High precision (95%) with low recall (60%) indicates the model is conservative - when it predicts a defect, it is usually correct, but it is missing many actual defects (false negatives). To improve recall, add more diverse training examples of defects, ensure balanced class representation, and potentially lower the probability threshold for detection.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-124", "question": "When using Azure Face Service, what is \"LargePersonGroup\" used for?", "options": ["To detect crowds in images", "To support identity verification against databases of up to 1 million people", "To recognize emotions in groups", "To process video streams with multiple people"], "correctAnswer": 1, "explanation": "LargePersonGroup is a container in Azure Face Service designed to hold up to 1 million persons for facial identification scenarios. Each person can have multiple faces registered. This is used for large-scale identity recognition systems like enterprise access control or large organization personnel identification.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-125", "question": "A retail analytics solution needs to track customer journey paths through a store while complying with GDPR privacy requirements. Which approach meets these requirements?", "options": ["Use facial recognition to identify repeat customers", "Collect only anonymous, aggregated movement counts and avoid storing biometric data or identities", "Store video footage indefinitely for analysis", "Use OCR to read customer loyalty cards at entrance"], "correctAnswer": 1, "explanation": "Privacy by design means collecting only what the analysis needs: anonymous, aggregated movement counts without identifying people or keeping biometric data. Facial recognition and loyalty-card reading identify individuals, and indefinite video storage keeps personal data far longer than needed. Azure AI Vision's Spatial Analysis feature, which once provided this kind of anonymous people tracking, was retired on March 30, 2025.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "hard", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-126", "question": "Which Azure service would you use to determine if customer feedback is positive, negative, or neutral?", "options": ["Azure Speech Service", "Azure AI Language service with sentiment analysis", "Azure Translator", "Azure Bot Service"], "correctAnswer": 1, "explanation": "Azure AI Language service provides sentiment analysis capabilities that evaluate text and return sentiment scores ranging from negative to positive. It can analyze text at both document and sentence levels, helping organizations understand customer opinions from feedback, reviews, and social media.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-127", "question": "What is the primary function of the Azure Speech Service?", "options": ["To translate documents between languages", "To convert speech to text and text to speech", "To analyze sentiment in written text", "To extract key phrases from documents"], "correctAnswer": 1, "explanation": "Azure Speech Service provides speech-to-text (STT) and text-to-speech (TTS) capabilities, enabling applications to transcribe spoken audio into text and convert text into natural-sounding speech. It also supports speech translation.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-128", "question": "Which feature of Azure AI Language service identifies important terms and concepts in text?", "options": ["Sentiment Analysis", "Key Phrase Extraction", "Language Detection", "Named Entity Recognition"], "correctAnswer": 1, "explanation": "Key Phrase Extraction identifies the main talking points and concepts in unstructured text. It returns a list of strings denoting the key talking points in the input text, helping to quickly identify the most important themes without reading the entire document.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-129", "question": "What does Named Entity Recognition (NER) do in Azure AI Language?", "options": ["Recognizes proper names of people, organizations, locations, and other entities", "Recognizes the emotions of people mentioned in text", "Recognizes spelling and grammar errors", "Recognizes duplicate sentences in text"], "correctAnswer": 0, "explanation": "Named Entity Recognition (NER) identifies and categorizes entities in text into predefined categories such as person names, organizations, locations, dates, quantities, and more. It helps extract structured information from unstructured text documents.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-130", "question": "Which Azure service automatically identifies the language of a text document?", "options": ["Azure Translator", "Azure AI Language service", "Azure Speech Service", "Azure AI Document Intelligence"], "correctAnswer": 1, "explanation": "Azure AI Language service provides language detection capabilities that can identify the language of a text document and returns a language code (like \"en\" for English, \"es\" for Spanish) along with a confidence score. It supports over 100 languages.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-131", "question": "What is the main purpose of Azure Translator?", "options": ["To convert speech to text", "To translate text between different languages", "To analyze sentiment in multiple languages", "To recognize entities in foreign languages"], "correctAnswer": 1, "explanation": "Azure Translator is a cloud-based machine translation service that translates text between more than 100 languages and dialects. It supports text translation, document translation, and custom translation models for domain-specific terminology.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-132", "question": "What does Conversational Language Understanding (CLU) enable applications to do?", "options": ["Translate conversations in real-time", "Understand user intents and extract information from natural language utterances", "Record and store voice conversations", "Analyze the sentiment of voice tone"], "correctAnswer": 1, "explanation": "Conversational Language Understanding (CLU), part of Azure AI Language, enables applications to understand natural language input by identifying user intents (what the user wants to do) and extracting entities (relevant information) from conversational text. It powers chatbots and voice assistants.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-133", "question": "A company wants to build a chatbot that can answer questions about their product documentation. Which Azure service should they use?", "options": ["Azure Speech Service", "Azure AI Language service with question answering (custom question answering)", "Azure Translator", "Azure Video Indexer"], "correctAnswer": 1, "explanation": "Azure AI Language service's custom question answering feature (formerly QnA Maker) allows you to build a knowledge base from your existing documents and FAQs. The chatbot can then find the most appropriate answer for user questions from this knowledge base without requiring complex dialog management.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-134", "question": "In speech-to-text processing, what is the purpose of \"profanity filtering\"?", "options": ["To block inappropriate audio from being processed", "To mask or remove offensive words from the transcription output", "To filter out background noise from audio", "To prevent unauthorized users from accessing the service"], "correctAnswer": 1, "explanation": "Profanity filtering in Azure Speech Service masks or removes offensive words from the transcription output. Options typically include: none (no filtering), masked (replacing profanity with asterisks), removed (deleting profanity entirely), or tags (marking profanity with XML tags).", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-135", "question": "What is the difference between speech-to-text and speech translation?", "options": ["Speech-to-text transcribes audio in one language; speech translation transcribes and translates to another language", "Speech-to-text is faster than speech translation", "Speech translation only works with written text", "There is no difference between the two services"], "correctAnswer": 0, "explanation": "Speech-to-text transcribes spoken audio into written text in the same language. Speech translation goes further by transcribing the audio and then translating it into a different language, outputting the result as either text or synthesized speech.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-136", "question": "In Conversational Language Understanding (CLU), what is an \"intent\"?", "options": ["A programming error in the language model", "The action or goal the user wants to accomplish", "The programming language used to build the bot", "The database connection string"], "correctAnswer": 1, "explanation": "In CLU, an intent represents the action or goal the user wants to accomplish. For example, in a travel bot, \"BookFlight\" and \"CheckWeather\" would be intents. The model learns to map user utterances (like \"I need a flight to Paris\") to the correct intent.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-137", "question": "What are \"entities\" in the context of Conversational Language Understanding?", "options": ["Companies that use Azure services", "Pieces of information extracted from user utterances that are relevant to the intent", "Errors in the natural language processing", "Security permissions for the service"], "correctAnswer": 1, "explanation": "Entities are specific pieces of information extracted from user utterances that are relevant to fulfilling their intent. For example, in \"Book a flight to Paris on Friday,\" the entities would be destination (Paris) and date (Friday). CLU can extract prebuilt entities (dates, numbers) and custom entities.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-138", "question": "A customer service application needs to categorize support tickets by urgency based on the customer's message. Which NLP capability is most appropriate?", "options": ["Language detection only", "Sentiment analysis and key phrase extraction", "Text-to-speech conversion", "Document translation"], "correctAnswer": 1, "explanation": "Sentiment analysis can identify frustrated or angry customers (high urgency), while key phrase extraction can identify critical issues mentioned in the ticket. Combining these capabilities allows automatic categorization and prioritization of support tickets based on content analysis.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-139", "question": "What is the purpose of \"speaker diarization\" in Azure Speech Service?", "options": ["To separate speech from background music", "To separate and label different speakers in an audio recording", "To convert stereo audio to mono", "To detect the language being spoken"], "correctAnswer": 1, "explanation": "Speaker diarization separates and labels different speakers in an audio stream. For example, it can output \"Speaker 1: Hello\" and \"Speaker 2: Hi there,\" making it clear who spoke which words in conversations or meetings. It labels speakers generically and does not identify who they are; Speaker Recognition, which identified people by voice, was retired on September 30, 2025.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-140", "question": "Which feature of Azure AI Language can identify personally identifiable information (PII) in documents?", "options": ["Sentiment Analysis", "Named Entity Recognition", "PII Detection and Redaction", "Language Detection"], "correctAnswer": 2, "explanation": "Azure AI Language provides PII detection capabilities that can identify and optionally redact sensitive information such as phone numbers, email addresses, credit card numbers, and personal names from text. This helps organizations comply with privacy regulations like GDPR and HIPAA.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-141", "question": "What is \"neural text-to-speech\" in Azure Speech Service?", "options": ["A method to convert brain signals to speech", "Deep neural network-based speech synthesis that produces natural-sounding voices", "Speech recognition for neural network researchers", "A type of speech therapy"], "correctAnswer": 1, "explanation": "Neural text-to-speech uses deep neural networks to synthesize speech that sounds nearly indistinguishable from human voices. It produces more natural prosody, intonation, and rhythm compared to traditional concatenative or parametric speech synthesis methods.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-142", "question": "In sentiment analysis, what do \"opinion mining\" or \"aspect-based sentiment analysis\" refer to?", "options": ["Mining cryptocurrency based on sentiment", "Analyzing sentiment toward specific aspects or features mentioned in text", "Collecting user opinions through surveys", "Mining data from opinion websites only"], "correctAnswer": 1, "explanation": "Opinion mining (aspect-based sentiment analysis) goes beyond overall document sentiment to identify sentiment toward specific aspects or features mentioned in text. For example, in a restaurant review, it can identify positive sentiment toward food but negative sentiment toward service.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-143", "question": "What is the function of \"speech synthesis markup language (SSML)\" in text-to-speech?", "options": ["To translate speech to different languages", "To control pronunciation, prosody, and other speech characteristics using XML markup", "To recognize speech patterns", "To compress audio files"], "correctAnswer": 1, "explanation": "SSML is an XML-based markup language that allows developers to control how text is converted to speech. It can specify pronunciation, stress, pitch, speaking rate, volume, and pauses, enabling fine-tuned control over the synthesized voice output for more natural-sounding speech.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-144", "question": "Which Azure service would you use to build an application that translates spoken conversations in real-time between English and Spanish speakers?", "options": ["Azure Translator Text API only", "Azure Speech Service with speech translation", "Azure AI Language service", "Azure Bot Service"], "correctAnswer": 1, "explanation": "Azure Speech Service's speech translation capability is designed for real-time speech-to-speech translation. It can transcribe spoken input, translate it to another language, and output the result as either text or synthesized speech, enabling natural multilingual conversations.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-145", "question": "What is a \"language model\" in the context of NLP?", "options": ["A person who speaks multiple languages", "A statistical or neural network model that understands and generates human language", "A database of vocabulary words", "A translation dictionary"], "correctAnswer": 1, "explanation": "A language model is a statistical or machine learning model trained on large amounts of text data to understand patterns in language. It can predict the likelihood of word sequences, generate text, understand context, and power various NLP tasks like translation, summarization, and question answering.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-146", "question": "A global call center needs to transcribe customer calls in 20 languages, detect sentiment, identify key phrases, and extract entities in real-time. Which architecture is most appropriate?", "options": ["Use Azure Speech Service for transcription, then send text to Azure AI Language for analysis", "Use Azure Translator to convert all calls to English first", "Store all calls and process them overnight in batches", "Use only Azure Video Indexer for all processing"], "correctAnswer": 0, "explanation": "The optimal architecture involves a pipeline: Azure Speech Service performs real-time speech-to-text transcription in the appropriate language, and the resulting text is sent to Azure AI Language service for sentiment analysis, key phrase extraction, and NER. This modular approach leverages each service's strengths and supports all required languages.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-147", "question": "In a CLU model, an utterance \"I need to book a flight from Seattle to Boston next Tuesday\" is mapped to the \"BookFlight\" intent. What are the entities that should be extracted?", "options": ["Only \"flight\"", "Origin (Seattle), Destination (Boston), and Date (next Tuesday)", "Only \"next Tuesday\"", "The entire sentence as one entity"], "correctAnswer": 1, "explanation": "The entities in this utterance are the specific pieces of information needed to fulfill the booking: Origin (Seattle), Destination (Boston), and Date (next Tuesday). These are the parameters that the application needs to execute the flight booking intent. The word \"flight\" is the domain but not an extractable entity in this context.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-148", "question": "A healthcare application needs to analyze patient notes to extract medical conditions, medications, and dosages while ensuring HIPAA compliance. Which approach should be used?", "options": ["Use standard Named Entity Recognition with public healthcare data", "Use Azure AI Language's custom NER with healthcare-specific training data, ensuring data is processed in a HIPAA-compliant environment with proper encryption", "Use Azure Translator to translate the notes to another language first", "Use sentiment analysis only"], "correctAnswer": 1, "explanation": "Healthcare applications require domain-specific entity recognition for medical terminology (conditions, medications, dosages). Azure AI Language's custom NER allows training on healthcare-specific data. HIPAA compliance requires proper data handling agreements, encryption in transit and at rest, and potentially deploying in a healthcare-compliant environment like Azure with Business Associate Agreements.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-149", "question": "When building a question answering system using Azure AI Language, what is the purpose of \"active learning\"?", "options": ["To reduce the cost of the service", "To continuously improve the model by suggesting alternative questions for review based on real user queries", "To translate questions to different languages", "To prevent users from asking off-topic questions"], "correctAnswer": 1, "explanation": "Active learning in Azure AI Language's question answering feature monitors real user queries that the model is uncertain about and suggests them for review. Subject matter experts can then add these variations to the knowledge base, continuously improving the model's accuracy without requiring manual review of all queries.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-150", "question": "A multilingual bot needs to understand that \"I want to reserve a table\" and \"Table booking please\" and \"Reservar una mesa\" all represent the same user intent. Which capabilities are required?", "options": ["Only Azure Translator", "Conversational Language Understanding with multilingual training and language detection", "Only text-to-speech", "Only key phrase extraction"], "correctAnswer": 1, "explanation": "This scenario requires Conversational Language Understanding (CLU) trained with multilingual utterances to recognize the same intent across languages. While Azure Translator could translate inputs to a single language, a multilingual CLU model natively understands the intent in all supported languages, providing better accuracy and lower latency without the translation step.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-151", "question": "What is generative AI?", "options": ["AI that can only classify images", "AI that creates new content such as text, images, or code based on training data", "AI that plays chess and board games", "AI that only performs data analysis"], "correctAnswer": 1, "explanation": "Generative AI refers to artificial intelligence systems that can create new content including text, images, audio, code, and video. These models learn patterns from training data and generate novel outputs, such as GPT models for text or DALL-E for images.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-152", "question": "Which Azure service provides access to OpenAI GPT models, gpt-image models, and embeddings?", "options": ["Azure Machine Learning", "Azure OpenAI Service", "Azure AI Language", "Azure Bot Service"], "correctAnswer": 1, "explanation": "Azure OpenAI Service provides REST API access to OpenAI models, including GPT models for text, gpt-image models for image generation (DALL-E 3 was retired on March 4, 2026), and embedding models. It combines OpenAI's models with Azure's security and compliance features.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-153", "question": "What is the primary purpose of prompt engineering?", "options": ["To train machine learning models from scratch", "To design effective inputs that guide AI models to produce desired outputs", "To create hardware for AI acceleration", "To manage Azure resource deployments"], "correctAnswer": 1, "explanation": "Prompt engineering is the practice of designing and refining input prompts to guide large language models toward producing accurate, relevant, and useful outputs. Well-crafted prompts improve model performance without requiring model retraining.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-154", "question": "What is zero-shot prompting?", "options": ["Providing many examples before asking the model to perform a task", "Asking the model to perform a task without providing any examples", "Training the model with zero data samples", "Using the model without an Azure subscription"], "correctAnswer": 1, "explanation": "Zero-shot prompting involves asking a model to perform a task directly without providing any examples. This tests the model's pre-trained knowledge and generalization capabilities. Large language models like GPT-4 can often perform many tasks effectively with zero-shot prompting.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-155", "question": "What is few-shot prompting?", "options": ["Running the model for only a few seconds", "Providing a few examples to guide the model before the main task", "Using only small models", "Training with minimal compute resources"], "correctAnswer": 1, "explanation": "Few-shot prompting provides the model with a small number of examples (typically 1-10) demonstrating the desired input-output pattern before presenting the actual task. This technique improves model performance on specific tasks by showing the pattern to follow.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-156", "question": "What is chain-of-thought prompting?", "options": ["Connecting multiple AI models in sequence", "Prompting the model to show its reasoning steps before giving the final answer", "Creating a network of training data", "Linking Azure services together"], "correctAnswer": 1, "explanation": "Chain-of-thought prompting encourages the model to break down complex problems into intermediate reasoning steps. By showing its work, the model often arrives at more accurate answers for tasks requiring logic, math, or multi-step reasoning.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-157", "question": "Which GPT model feature allows processing both text and images in the same input?", "options": ["Text completion only", "Multimodal capabilities", "Token streaming", "Batch processing"], "correctAnswer": 1, "explanation": "Multimodal capabilities in GPT-4 and later models allow the model to understand and reason across multiple input types including text and images. Users can ask questions about images, have the model analyze visual content, and receive text-based responses.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-158", "question": "What is the purpose of content filtering in Azure OpenAI Service?", "options": ["To reduce API costs", "To detect and prevent harmful content generation", "To speed up response times", "To limit token usage"], "correctAnswer": 1, "explanation": "Azure OpenAI Service includes content filtering to detect and mitigate potentially harmful content including hate speech, self-harm, sexual content, and violence. This helps organizations deploy AI responsibly and maintain safety standards.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts", "azure-responsible-ai"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-159", "question": "What are tokens in the context of large language models?", "options": ["Authentication keys for API access", "Units of text (words or parts of words) that the model processes", "Digital currency for Azure services", "Security certificates"], "correctAnswer": 1, "explanation": "Tokens are the basic units of text that language models process. A token can be a whole word, part of a word, or punctuation. Models have token limits for input and output, and pricing is often based on token usage.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-160", "question": "What is the context window of a language model?", "options": ["The browser window used to access the model", "The maximum amount of text (in tokens) the model can process in a single request", "The geographical region where the model is hosted", "The user interface for the model"], "correctAnswer": 1, "explanation": "The context window is the maximum number of tokens a language model can process in a single request, including both input prompt and generated output. Larger context windows allow for longer conversations and document analysis.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-161", "question": "Which Microsoft 365 feature provides AI-powered assistance across Office applications?", "options": ["Azure Machine Learning", "Microsoft 365 Copilot", "Power Automate", "SharePoint AI"], "correctAnswer": 1, "explanation": "Microsoft 365 Copilot integrates AI capabilities across Office applications like Word, Excel, PowerPoint, Outlook, and Teams. It helps users draft documents, analyze data, create presentations, and manage communications using generative AI.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-copilot-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-162", "question": "What is GitHub Copilot?", "options": ["A code repository hosting service", "An AI pair programmer that suggests code completions", "A version control system", "A project management tool"], "correctAnswer": 1, "explanation": "GitHub Copilot is an AI-powered code completion tool that suggests code as developers type. It's powered by OpenAI Codex and can generate function implementations, documentation, and even entire code blocks based on comments and context.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-copilot-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-163", "question": "What is Copilot Studio used for?", "options": ["Creating custom AI copilots for specific business scenarios", "Writing code for mobile applications", "Designing database schemas", "Managing Azure subscriptions"], "correctAnswer": 0, "explanation": "Copilot Studio is a low-code platform for creating custom AI copilots. Organizations can build tailored conversational AI experiences that integrate with their data and workflows, extending Microsoft Copilot capabilities for specific business needs.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-copilot-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-164", "question": "What are gpt-image models in Azure OpenAI Service?", "options": ["A text classification model", "An AI model that generates images from text descriptions", "A speech recognition service", "A data analytics tool"], "correctAnswer": 1, "explanation": "gpt-image models are generative AI models that create and edit images from text prompts. They replaced DALL-E 3, which Microsoft retired in Azure OpenAI on March 4, 2026.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-165", "question": "What is the purpose of embeddings in Azure OpenAI Service?", "options": ["To encrypt API communications", "To convert text into numerical vectors for similarity search", "To compress image files", "To authenticate users"], "correctAnswer": 1, "explanation": "Embeddings convert text into numerical vectors that capture semantic meaning. These vectors enable similarity searches, clustering, and classification tasks. Applications include semantic search, recommendation systems, and anomaly detection.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-166", "question": "What is fine-tuning in the context of large language models?", "options": ["Adjusting the user interface", "Training a pre-trained model on specific data to improve performance on specialized tasks", "Optimizing network connections", "Reducing model file size"], "correctAnswer": 1, "explanation": "Fine-tuning involves taking a pre-trained language model and training it further on domain-specific data. This adapts the model for specialized tasks or industries while requiring less data and compute than training from scratch.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-167", "question": "What is a key limitation of large language models?", "options": ["They can only process English text", "They may generate plausible-sounding but incorrect information (hallucinations)", "They require internet connectivity at all times", "They can only run on supercomputers"], "correctAnswer": 1, "explanation": "Large language models can produce hallucinations—confidently stated but incorrect or fabricated information. This is because they predict likely text patterns rather than accessing verified facts. Users should verify important information from LLM outputs.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-168", "question": "What is abuse monitoring in Azure OpenAI Service?", "options": ["Tracking API usage costs", "Detecting and preventing misuse of AI services", "Monitoring server performance", "Managing user subscriptions"], "correctAnswer": 1, "explanation": "Abuse monitoring in Azure OpenAI Service detects potential misuse such as attempts to generate harmful content, jailbreak attempts, or other policy violations. This helps maintain platform integrity and responsible AI usage.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts", "azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-169", "question": "What is retrieval-augmented generation (RAG)?", "options": ["A method to increase model training speed", "Combining information retrieval with text generation to ground responses in specific data", "A technique for compressing models", "A way to reduce API latency"], "correctAnswer": 1, "explanation": "Retrieval-augmented generation combines information retrieval from a knowledge base with language model generation. The model retrieves relevant documents first, then generates answers based on that retrieved information, improving accuracy and reducing hallucinations.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-170", "question": "Which approach helps reduce hallucinations when using LLMs for question answering?", "options": ["Using longer prompts", "Grounding the model with retrieved context from verified sources", "Increasing the temperature setting", "Removing content filters"], "correctAnswer": 1, "explanation": "Grounding LLMs with retrieved context from verified sources helps reduce hallucinations. By providing relevant, factual information in the prompt, the model bases its answers on provided context rather than relying solely on its training data, improving accuracy.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-171", "question": "What does temperature control in language model generation?", "options": ["The physical temperature of servers", "The randomness or creativity of the model's output", "The processing speed", "The number of tokens used"], "correctAnswer": 1, "explanation": "Temperature controls the randomness in language model output. Lower temperatures (e.g., 0.2) produce more focused, deterministic responses, while higher temperatures (e.g., 0.9) generate more diverse, creative outputs. It's useful for balancing consistency and creativity.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-172", "question": "What is the purpose of system messages in Azure OpenAI Service?", "options": ["To configure server hardware", "To set the behavior and context for the AI assistant", "To manage user authentication", "To track API usage"], "correctAnswer": 1, "explanation": "System messages in Azure OpenAI Service set the context, behavior, and constraints for the AI assistant. They define the persona, tone, and guidelines the model should follow throughout the conversation, such as \"You are a helpful technical assistant.\"", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-173", "question": "Which Microsoft tool allows developers to build AI-powered search experiences?", "options": ["Azure DevOps", "Azure AI Search with vector capabilities", "Visual Studio Code", "Microsoft Teams"], "correctAnswer": 1, "explanation": "Azure AI Search (formerly Azure Cognitive Search) with vector capabilities enables developers to build sophisticated search experiences. It supports vector search for semantic similarity, hybrid search combining keyword and vector approaches, and integration with Azure OpenAI embeddings.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-174", "question": "What is the main benefit of using Azure OpenAI Service instead of directly using OpenAI's API?", "options": ["Lower cost for all use cases", "Enterprise security, compliance, and Azure integration", "Access to more powerful models", "Unlimited token usage"], "correctAnswer": 1, "explanation": "Azure OpenAI Service provides OpenAI's models with the added benefits of Azure's enterprise security, compliance certifications, private networking, and integration with Azure services. This makes it suitable for enterprise deployments requiring data governance.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-175", "question": "What is prompt injection in the context of AI security?", "options": ["Adding more tokens to a prompt", "Malicious attempts to override system instructions through user input", "Injecting code into the AI model", "Speeding up prompt processing"], "correctAnswer": 1, "explanation": "Prompt injection is an attack where malicious users craft inputs designed to override or bypass system instructions in language models. For example, attempting to make the model ignore safety guidelines or reveal system prompts through cleverly constructed user messages.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts", "azure-responsible-ai"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-176", "question": "Which technique involves breaking a complex task into smaller subtasks handled by multiple AI prompts?", "options": ["Single-shot prompting", "Prompt chaining", "Temperature adjustment", "Token reduction"], "correctAnswer": 1, "explanation": "Prompt chaining breaks complex tasks into a sequence of simpler prompts where the output of one becomes input for the next. This modular approach improves reliability, makes debugging easier, and allows handling tasks too complex for a single prompt.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-177", "question": "What is the Azure OpenAI Service feature that allows models to call external functions or APIs?", "options": ["Model training", "Function calling", "Token streaming", "Batch processing"], "correctAnswer": 1, "explanation": "Function calling in Azure OpenAI Service allows models to intelligently determine when to call external functions or APIs based on user input. The model outputs a structured function call that the application can execute, then the results can be fed back to the model.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-178", "question": "What is the primary purpose of Azure AI Content Safety?", "options": ["To accelerate model training", "To detect harmful content across text and images", "To manage API keys", "To optimize model performance"], "correctAnswer": 1, "explanation": "Azure AI Content Safety detects harmful content across text and images including hate speech, self-harm, sexual content, and violence. It can be used independently or integrated with other Azure AI services to build safer applications.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts", "azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-179", "question": "Which factor should be considered when selecting a GPT model for a specific use case?", "options": ["Only the model name", "Capabilities, context window, cost, and latency requirements", "The color of the Azure portal", "The number of developers on the team"], "correctAnswer": 1, "explanation": "Selecting a GPT model requires considering multiple factors: capabilities needed for the task, context window size for input length, cost per token for budget constraints, and latency requirements for response speed. Different models offer different trade-offs.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-180", "question": "What is the main advantage of using vector databases with generative AI?", "options": ["They store data in alphabetical order", "They enable efficient semantic search and retrieval based on meaning", "They reduce the need for any AI models", "They automatically generate training data"], "correctAnswer": 1, "explanation": "Vector databases store embeddings (numerical representations of meaning) and enable efficient similarity search based on semantic meaning rather than keyword matching. This allows finding conceptually related content, essential for RAG and semantic search applications.", "exams": ["azure-ai-900"], "category": "azure-generative-ai", "topics": ["azure-generative-ai-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-181", "question": "What type of machine learning uses labeled training data with known outcomes?", "options": ["Unsupervised learning", "Supervised learning", "Reinforcement learning", "Transfer learning"], "correctAnswer": 1, "explanation": "Supervised learning uses labeled training data where both input features and correct outputs are provided. The algorithm learns to map inputs to outputs based on these examples, enabling prediction on new, unseen data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-182", "question": "Which Azure service is specifically designed for building conversational AI interfaces?", "options": ["Azure Synapse Analytics", "Azure Bot Service", "Azure DevOps", "Azure Active Directory"], "correctAnswer": 1, "explanation": "Azure Bot Service provides an integrated environment for building, testing, and deploying conversational AI bots. It integrates with Azure AI Language Service for natural language understanding and supports multiple channels including web, Teams, and Slack.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-183", "question": "What is the primary function of Azure AI Vision's Image Analysis feature?", "options": ["Storing images in the cloud", "Extracting information and insights from images", "Compressing image file sizes", "Converting images to video"], "correctAnswer": 1, "explanation": "Azure AI Vision's Image Analysis extracts rich information from images including objects, scenes, text (OCR), faces, and image descriptions. It uses pre-trained models to provide insights about visual content without requiring custom model training.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-184", "question": "Which principle of responsible AI emphasizes treating all people fairly?", "options": ["Privacy and security", "Fairness", "Transparency", "Accountability"], "correctAnswer": 1, "explanation": "Fairness is a core principle of responsible AI that emphasizes treating all individuals and groups equitably. AI systems should not discriminate based on protected characteristics like race, gender, age, or disability, and should be tested for biased outcomes.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-185", "question": "What type of neural network is commonly used for image recognition tasks?", "options": ["Recurrent Neural Networks (RNN)", "Convolutional Neural Networks (CNN)", "Feedforward Neural Networks", "Boltzmann Machines"], "correctAnswer": 1, "explanation": "Convolutional Neural Networks (CNNs) are specifically designed for image processing tasks. They use convolutional layers to automatically detect features like edges, textures, and patterns, making them highly effective for image classification and object detection.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-186", "question": "Which Azure service enables custom machine learning model development with a visual interface?", "options": ["Azure Virtual Machines", "Azure Machine Learning designer", "Azure Storage", "Azure Functions"], "correctAnswer": 1, "explanation": "Azure Machine Learning designer provides a drag-and-drop visual interface for building, testing, and deploying machine learning models. It allows users to create ML pipelines using pre-built modules without writing code, while also supporting custom code when needed.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-187", "question": "What is the purpose of Named Entity Recognition (NER) in NLP?", "options": ["To count words in a document", "To identify and classify named entities like people, organizations, and locations", "To translate text between languages", "To check spelling and grammar"], "correctAnswer": 1, "explanation": "Named Entity Recognition (NER) identifies and categorizes named entities in text such as person names, organizations, locations, dates, and quantities. It helps extract structured information from unstructured text for analysis and indexing.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-188", "question": "Which Azure AI Vision feature can detect and identify human faces in images?", "options": ["Object detection", "Face detection and analysis", "Optical character recognition", "Image captioning"], "correctAnswer": 1, "explanation": "Azure AI Face detects human faces in images and returns face location, landmarks, and attributes such as head pose, glasses, and mask; Microsoft retired the emotion and gender attributes. Face identification and verification are Limited Access features used for identity verification and access control.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-10-28"}, {"id": "azure-ai-900-q-189", "question": "What is clustering in unsupervised machine learning?", "options": ["Grouping data points into categories based on similarity without pre-defined labels", "Organizing training data alphabetically", "Combining multiple AI models", "Storing data in cloud clusters"], "correctAnswer": 0, "explanation": "Clustering is an unsupervised learning technique that groups similar data points together based on their features. Unlike classification, clustering doesn't require pre-labeled data and discovers natural groupings in the data automatically.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-190", "question": "Which responsible AI principle focuses on understanding how AI systems make decisions?", "options": ["Reliability and safety", "Transparency", "Inclusiveness", "Privacy"], "correctAnswer": 1, "explanation": "Transparency in responsible AI means understanding and explaining how AI systems make decisions. This includes documenting how models work, what data they use, and being able to explain why specific decisions were made, which builds trust and enables debugging.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-191", "question": "What does Azure AI Language Service's sentiment analysis determine?", "options": ["The language of the text", "The emotional tone (positive, negative, neutral) of text", "The grammar correctness", "The reading level"], "correctAnswer": 1, "explanation": "Sentiment analysis in Azure AI Language Service evaluates text to determine the emotional tone, categorizing it as positive, negative, neutral, or mixed. It can also provide confidence scores and aspect-based sentiment for specific topics within the text.", "exams": ["azure-ai-900"], "category": "azure-nlp", "topics": ["azure-nlp-solutions"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-192", "question": "What is the purpose of Azure Custom Vision?", "options": ["To create pre-built computer vision models", "To build and deploy custom image classification and object detection models", "To store large image collections", "To convert images to text documents"], "correctAnswer": 1, "explanation": "Azur e-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}];
const KEY = "offline_progress:" + document.title;
const L = "ABCDEFGH";
let prog = JSON.parse(localStorage.getItem(KEY) || "{}"); // id -> chosen index
let list = [], idx = 0;
const $ = id => document.getElementById(id);
const cats = [...new Set(ALL.map(q => q.category))];
$("cat").innerHTML = '<option value="">Mọi chủ đề</option>' + cats.map(c => `<option>${c}</option>`).join("");
function save(){ localStorage.setItem(KEY, JSON.stringify(prog)); }
function build(){
  const c = $("cat").value, m = $("mode").value;
  list = ALL.filter(q => (!c || q.category === c) &&
    (m === "all" || (m === "new" && !(q.id in prog)) || (m === "missed" && q.id in prog && prog[q.id] !== q.correctAnswer)));
  idx = 0; render();
}
function render(){
  const done = ALL.filter(q => q.id in prog), ok = done.filter(q => prog[q.id] === q.correctAnswer);
  $("score").textContent = `Đúng ${ok.length}/${done.length} · đã làm ${done.length}/${ALL.length}`;
  if (!list.length){ $("meta").textContent = ""; $("q").textContent = "Không có câu hỏi nào."; $("opts").innerHTML = ""; $("exp").style.display = "none"; return; }
  const q = list[idx];
  $("meta").textContent = `Câu ${idx+1}/${list.length} · ${q.id} · ${q.category} · ${q.difficulty}`;
  $("q").textContent = q.question;
  $("opts").innerHTML = "";
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = `${L[i]}. ${o}`;
    b.onclick = () => { prog[q.id] = i; save(); render(); };
    $("opts").appendChild(b);
  });
  const exp = $("exp");
  if (q.id in prog){
    const btns = $("opts").children;
    btns[q.correctAnswer].classList.add("correct");
    if (prog[q.id] !== q.correctAnswer) btns[prog[q.id]].classList.add("wrong");
    exp.innerHTML = `<b>Đáp án: ${L[q.correctAnswer]}</b><br>`;
    exp.appendChild(document.createTextNode(q.explanation || ""));
    exp.style.display = "block";
  } else exp.style.display = "none";
}
$("prev").onclick = () => { if (idx > 0){ idx--; render(); } };
$("next").onclick = () => { if (idx < list.length - 1){ idx++; render(); } };
$("cat").onchange = $("mode").onchange = build;
$("shuffle").onclick = () => { for (let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [list[i], list[j]] = [list[j], list[i]]; } idx = 0; render(); };
$("reset").onclick = () => { if (confirm("Xoá toàn bộ tiến độ?")){ prog = {}; save(); build(); } };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
  else { const i = L.toLowerCase().indexOf(e.key.toLowerCase()); const b = $("opts").children[i]; if (i >= 0 && b) b.click(); }
});
build();
</script></body></html>
