<script>
const ALL = [{"id": "azure-ai-900-q-001", "question": "What is the primary goal of machine learning?", "options": ["To program explicit rules for every scenario", "To enable computers to learn from data and improve without explicit programming", "To replace all human decision-making", "To create only neural network models"], "correctAnswer": 1, "explanation": "Machine learning enables computers to learn patterns from data and make predictions or decisions without being explicitly programmed for every scenario. This is fundamentally different from traditional rule-based programming where developers must code every possible outcome.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-002", "question": "Which Microsoft principle of Responsible AI focuses on ensuring AI systems treat all people fairly?", "options": ["Reliability and safety", "Fairness", "Privacy and security", "Inclusiveness"], "correctAnswer": 1, "explanation": "Fairness is the Responsible AI principle that ensures AI systems treat all people fairly and do not discriminate based on factors like gender, race, or socioeconomic status. Microsoft actively works to identify and mitigate bias in AI models to promote equitable outcomes.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-003", "question": "Anomaly detection is best described as which type of AI workload?", "options": ["Predicting future values based on historical data", "Identifying unusual patterns or outliers in data", "Understanding and generating human language", "Processing and analyzing visual information"], "correctAnswer": 1, "explanation": "Anomaly detection is an AI workload that identifies unusual patterns or outliers in data that do not conform to expected behavior. It is commonly used for fraud detection, network security monitoring, and equipment failure prediction in manufacturing.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-004", "question": "What does the Responsible AI principle of Transparency require?", "options": ["Making all AI algorithms open source", "Providing clear explanations of how AI systems make decisions", "Sharing all training data with the public", "Publishing AI system source code"], "correctAnswer": 1, "explanation": "Transparency in Responsible AI means that AI systems should be understandable and interpretable, allowing users to comprehend how decisions are made. This does not require open-sourcing algorithms or data, but rather providing meaningful explanations of AI behavior.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-005", "question": "Which AI workload would be most appropriate for forecasting product demand for the next quarter?", "options": ["Computer vision", "Natural language processing", "Prediction and forecasting", "Knowledge mining"], "correctAnswer": 2, "explanation": "Prediction and forecasting workloads use historical data to predict future values or trends. This is ideal for demand forecasting, sales prediction, and resource planning scenarios where past patterns can inform future expectations.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-006", "question": "A retail company wants to automatically identify suspicious transactions in real-time. Which AI workload should they use?", "options": ["Image classification", "Anomaly detection", "Sentiment analysis", "Speech recognition"], "correctAnswer": 1, "explanation": "Anomaly detection is specifically designed to identify unusual patterns that deviate from normal behavior. For fraud detection, the system learns normal transaction patterns and flags deviations that may indicate fraudulent activity.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-007", "question": "The Responsible AI principle of Accountability means that:", "options": ["AI systems must always be supervised by humans", "People must be responsible for decisions made by AI systems", "AI developers are the only ones responsible for AI outcomes", "Organizations cannot use AI for critical decisions"], "correctAnswer": 1, "explanation": "Accountability in Responsible AI establishes that people must remain responsible for decisions made by AI systems. Organizations must establish governance frameworks that define who is responsible for AI system outcomes and ensure appropriate oversight.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-008", "question": "Computer vision AI workloads are primarily used for:", "options": ["Processing text documents", "Analyzing and interpreting visual information from images and videos", "Predicting stock market trends", "Understanding spoken language"], "correctAnswer": 1, "explanation": "Computer vision enables AI systems to analyze and interpret visual information from images and videos. This includes tasks like object detection, facial recognition, image classification, and optical character recognition (OCR).", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-009", "question": "Which scenario best demonstrates the Responsible AI principle of Inclusiveness?", "options": ["An AI system that works equally well for users with disabilities", "An AI system that processes data faster than competitors", "An AI system that reduces operational costs", "An AI system that uses less computing power"], "correctAnswer": 0, "explanation": "Inclusiveness ensures that AI systems are designed to benefit all people regardless of ability, background, or circumstances. An AI system that accommodates users with disabilities demonstrates inclusive design principles.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-010", "question": "Natural Language Processing (NLP) AI workloads enable systems to:", "options": ["Process and analyze visual content", "Understand, interpret, and generate human language", "Control robotic movements", "Predict weather patterns"], "correctAnswer": 1, "explanation": "Natural Language Processing (NLP) enables AI systems to understand, interpret, and generate human language. This includes capabilities like text analysis, sentiment analysis, language translation, and conversational AI.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-011", "question": "A manufacturing company wants to predict when equipment will fail before it happens. Which AI workload is most appropriate?", "options": ["Image recognition", "Predictive maintenance using anomaly detection", "Speech synthesis", "Text translation"], "correctAnswer": 1, "explanation": "Predictive maintenance combines anomaly detection with forecasting to identify potential equipment failures before they occur. The system analyzes sensor data to detect patterns that typically precede failures, allowing proactive maintenance scheduling.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-012", "question": "The Privacy and Security principle in Responsible AI requires:", "options": ["All AI data to be stored on-premise only", "AI systems to be secure and respect user privacy", "AI systems to never collect personal data", "All AI decisions to be made public"], "correctAnswer": 1, "explanation": "The Privacy and Security principle requires that AI systems be secure, protect sensitive data, and respect user privacy. This includes implementing appropriate data protection measures, encryption, access controls, and compliance with privacy regulations.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-013", "question": "Knowledge mining AI workloads are used to:", "options": ["Extract valuable information from large volumes of unstructured data", "Create 3D models from 2D images", "Translate spoken language in real-time", "Generate new product designs"], "correctAnswer": 0, "explanation": "Knowledge mining extracts valuable insights from large volumes of unstructured data such as documents, images, and media files. It combines AI capabilities like NLP, computer vision, and search to discover patterns and relationships in data.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-014", "question": "Autonomous systems in AI refer to:", "options": ["Software systems that require constant human supervision", "Systems capable of performing tasks without human intervention", "Cloud-based data storage systems", "Network security protocols"], "correctAnswer": 1, "explanation": "Autonomous systems are AI-powered systems capable of performing tasks and making decisions without direct human intervention. Examples include self-driving vehicles, autonomous drones, and automated industrial robots.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-015", "question": "A bank notices their loan approval AI system consistently rejects applications from a specific demographic group. Which Responsible AI principle is being violated?", "options": ["Reliability and safety", "Fairness", "Transparency", "Accountability"], "correctAnswer": 1, "explanation": "This scenario demonstrates a violation of the Fairness principle, where the AI system is exhibiting discriminatory behavior against a specific demographic group. Fairness requires that AI systems treat all people equitably and not perpetuate biases.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-016", "question": "Which of the following is an example of generative AI?", "options": ["A system that classifies emails as spam or not spam", "A system that creates new images based on text descriptions", "A system that identifies objects in photographs", "A system that predicts tomorrow's temperature"], "correctAnswer": 1, "explanation": "Generative AI creates new content such as text, images, audio, or code based on learned patterns. A system that generates images from text descriptions is a classic example of generative AI, using models like DALL-E or Stable Diffusion.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-generative-ai-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-017", "question": "Reliability and Safety in Responsible AI means:", "options": ["AI systems should never fail under any circumstances", "AI systems should perform consistently and safely under expected conditions", "AI systems should only be used in non-critical applications", "AI systems should have manual override options only"], "correctAnswer": 1, "explanation": "Reliability and Safety requires that AI systems perform consistently and safely under expected conditions, with appropriate safeguards for edge cases. This includes thorough testing, validation, and monitoring to ensure predictable behavior.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-018", "question": "A company wants to automatically categorize customer support tickets by urgency. Which AI workload is most suitable?", "options": ["Computer vision", "Natural language processing", "Anomaly detection", "Autonomous systems"], "correctAnswer": 1, "explanation": "Natural Language Processing (NLP) is ideal for analyzing and categorizing text-based content like support tickets. NLP can understand ticket content, extract intent and sentiment, and classify tickets by urgency or topic automatically.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-019", "question": "Which scenario demonstrates the use of computer vision in healthcare?", "options": ["Scheduling patient appointments automatically", "Analyzing medical images to detect tumors", "Transcribing doctor-patient conversations", "Managing electronic health records"], "correctAnswer": 1, "explanation": "Analyzing medical images to detect tumors is a computer vision application. AI systems can examine X-rays, MRIs, and CT scans to identify anomalies, assisting radiologists in diagnosis and potentially catching issues earlier.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-020", "question": "What is a key consideration when implementing AI systems for high-stakes decisions like medical diagnosis?", "options": ["AI systems should replace human judgment entirely", "Human oversight and the ability to explain AI decisions are essential", "Only simple algorithms should be used", "AI systems should only provide binary yes/no answers"], "correctAnswer": 1, "explanation": "For high-stakes decisions, human oversight and explainability are essential. The Transparency principle requires that AI decisions can be understood and reviewed by humans, and Accountability ensures humans remain responsible for outcomes.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-021", "question": "A chatbot that can understand customer questions and provide relevant responses uses which type of AI workload?", "options": ["Computer vision", "Natural language processing", "Time series forecasting", "Reinforcement learning only"], "correctAnswer": 1, "explanation": "Conversational AI and chatbots rely on Natural Language Processing to understand user input, determine intent, and generate appropriate responses. This involves multiple NLP capabilities including intent recognition, entity extraction, and response generation.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-022", "question": "Which approach helps identify potential bias in AI training data?", "options": ["Using more computing power", "Analyzing data distributions across different demographic groups", "Reducing the size of the dataset", "Encrypting all training data"], "correctAnswer": 1, "explanation": "Analyzing data distributions across demographic groups helps identify potential bias in training data. If certain groups are underrepresented or represented with skewed patterns, the resulting model may exhibit unfair behavior toward those groups.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-023", "question": "Generative AI models like GPT are primarily used for:", "options": ["Sorting numerical data", "Creating new content including text, code, and images", "Optimizing database queries", "Monitoring network traffic"], "correctAnswer": 1, "explanation": "Generative AI models like GPT create new content by learning patterns from training data. They can generate human-like text, write code, create images, compose music, and produce various other types of creative content based on prompts.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-generative-ai-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-024", "question": "A retail company uses AI to analyze social media posts about their products. This is an example of:", "options": ["Computer vision", "Sentiment analysis using NLP", "Anomaly detection", "Predictive maintenance"], "correctAnswer": 1, "explanation": "Sentiment analysis is an NLP technique that determines the emotional tone behind text. By analyzing social media posts, companies can understand public opinion, track brand perception, and identify customer satisfaction trends.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-ai-workloads-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-025", "question": "What is the primary risk of deploying an AI system without proper Responsible AI governance?", "options": ["The system will be slower than competitors", "Potential for harmful outcomes including bias, privacy violations, and lack of accountability", "The system will require more cloud storage", "The system will have higher latency"], "correctAnswer": 1, "explanation": "Without proper Responsible AI governance, organizations risk deploying systems that may cause harm through biased decisions, privacy violations, security vulnerabilities, and unclear accountability. These risks can damage users, reputation, and legal standing.", "exams": ["azure-ai-900"], "category": "azure-ai-workloads", "topics": ["azure-responsible-ai"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-026", "question": "In supervised learning, what is the relationship between features and labels?", "options": ["Features and labels are the same thing", "Features are input variables used to predict the label (output)", "Labels are used to create features", "There is no relationship between features and labels"], "correctAnswer": 1, "explanation": "In supervised learning, features are the input variables (independent variables) that the model uses to make predictions, while the label is the output variable (dependent variable) that the model learns to predict based on the features.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-027", "question": "What distinguishes unsupervised learning from supervised learning?", "options": ["Unsupervised learning requires more computing power", "Unsupervised learning works with unlabeled data to find patterns", "Unsupervised learning is always more accurate", "Unsupervised learning can only work with images"], "correctAnswer": 1, "explanation": "Unsupervised learning works with unlabeled data, finding hidden patterns and structures without predefined target outputs. Common tasks include clustering similar data points and dimensionality reduction.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-028", "question": "Regression is a machine learning technique used for:", "options": ["Classifying data into categories", "Predicting continuous numerical values", "Grouping similar data points", "Reducing data dimensionality"], "correctAnswer": 1, "explanation": "Regression is used to predict continuous numerical values such as prices, temperatures, or sales figures. It models the relationship between input features and a continuous output variable.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-029", "question": "Classification algorithms are best suited for which type of problem?", "options": ["Predicting house prices", "Determining whether an email is spam or not spam", "Forecasting stock prices", "Estimating temperature trends"], "correctAnswer": 1, "explanation": "Classification is used to predict discrete categories or classes. Determining whether an email is spam or not spam is a binary classification problem where the output is a discrete category rather than a continuous value.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-030", "question": "Clustering is an example of which type of machine learning?", "options": ["Supervised learning", "Unsupervised learning", "Reinforcement learning", "Semi-supervised learning"], "correctAnswer": 1, "explanation": "Clustering is an unsupervised learning technique that groups similar data points together without predefined labels. The algorithm discovers natural groupings in the data based on feature similarities.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-031", "question": "In reinforcement learning, what does an agent learn to do?", "options": ["Memorize all training data", "Take actions in an environment to maximize rewards", "Cluster similar data points", "Reduce the dimensionality of data"], "correctAnswer": 1, "explanation": "In reinforcement learning, an agent learns to make decisions by taking actions in an environment to maximize cumulative rewards. The agent learns through trial and error, receiving feedback in the form of rewards or penalties.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-032", "question": "Deep learning differs from traditional machine learning primarily in that:", "options": ["Deep learning uses neural networks with multiple layers", "Deep learning requires less data", "Deep learning is always faster to train", "Deep learning only works with images"], "correctAnswer": 0, "explanation": "Deep learning uses artificial neural networks with multiple hidden layers (hence \"deep\") to learn hierarchical representations of data. These deep neural networks can automatically learn complex features from raw data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-033", "question": "A model that predicts whether a customer will churn (leave) or stay is an example of:", "options": ["Regression", "Binary classification", "Clustering", "Dimensionality reduction"], "correctAnswer": 1, "explanation": "Predicting whether a customer will churn (yes/no) is a binary classification problem. The output has two possible classes, making it a binary rather than multi-class classification scenario.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-034", "question": "What is the purpose of splitting data into training and testing sets?", "options": ["To reduce the amount of data processed", "To evaluate model performance on unseen data", "To increase training speed", "To simplify the model architecture"], "correctAnswer": 1, "explanation": "Splitting data into training and testing sets allows evaluation of model performance on data it has not seen during training. This helps estimate how well the model will generalize to new, real-world data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-035", "question": "Overfitting occurs when a machine learning model:", "options": ["Is too simple to capture patterns in data", "Memorizes training data but performs poorly on new data", "Takes too long to train", "Uses too little computational power"], "correctAnswer": 1, "explanation": "Overfitting occurs when a model learns the training data too well, including its noise and outliers, resulting in poor generalization to new data. The model essentially memorizes rather than learns generalizable patterns.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-036", "question": "K-means is an algorithm commonly used for:", "options": ["Predicting continuous values", "Clustering data into K groups", "Classifying text sentiment", "Reducing image resolution"], "correctAnswer": 1, "explanation": "K-means is a clustering algorithm that partitions data into K distinct groups based on feature similarity. It iteratively assigns data points to clusters and updates cluster centers until convergence.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-037", "question": "A recommendation system that suggests products based on similar users' preferences uses:", "options": ["Supervised classification", "Collaborative filtering", "Linear regression", "Dimensionality reduction"], "correctAnswer": 1, "explanation": "Collaborative filtering is a technique used in recommendation systems that makes predictions based on the collective behavior of similar users. It assumes that users who agreed in the past will agree in the future.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-038", "question": "In a neural network, what is the role of the activation function?", "options": ["To store training data", "To introduce non-linearity and determine neuron output", "To reduce the number of layers", "To encrypt model weights"], "correctAnswer": 1, "explanation": "Activation functions introduce non-linearity into neural networks, allowing them to learn complex patterns. They determine whether a neuron should be activated based on the weighted sum of inputs, producing the neuron's output.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-039", "question": "Feature engineering is the process of:", "options": ["Creating new hardware for ML training", "Selecting and transforming variables for use in models", "Visualizing model results", "Deploying models to production"], "correctAnswer": 1, "explanation": "Feature engineering involves selecting, modifying, or creating variables (features) from raw data to improve model performance. This includes techniques like normalization, encoding categorical variables, and creating derived features.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-040", "question": "Which metric would be most appropriate for evaluating a binary classification model?", "options": ["Mean squared error", "Accuracy, precision, and recall", "R-squared", "Silhouette score"], "correctAnswer": 1, "explanation": "For binary classification, metrics like accuracy, precision, and recall are appropriate. These measure different aspects of classification performance, including overall correctness, ability to avoid false positives, and ability to find all positive instances.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-041", "question": "Cross-validation is used to:", "options": ["Speed up model training", "Assess model generalization using multiple train-test splits", "Reduce the number of features", "Encrypt the training data"], "correctAnswer": 1, "explanation": "Cross-validation assesses model generalization by partitioning data into multiple subsets, training on some and validating on others in rotation. This provides a more robust estimate of model performance than a single train-test split.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-042", "question": "A model that predicts housing prices based on features like square footage and location is using:", "options": ["Classification", "Regression", "Clustering", "Association rules"], "correctAnswer": 1, "explanation": "Predicting housing prices is a regression problem because the output is a continuous numerical value. The model learns the relationship between input features (square footage, location) and the continuous target variable (price).", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-043", "question": "What is the primary advantage of using ensemble methods like Random Forest?", "options": ["They always train faster than single models", "They combine multiple models to improve accuracy and robustness", "They require less training data", "They are easier to interpret"], "correctAnswer": 1, "explanation": "Ensemble methods like Random Forest combine predictions from multiple models to improve overall performance. By aggregating diverse models, they often achieve better accuracy and are less prone to overfitting than single models.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-044", "question": "In the machine learning lifecycle, what occurs during the deployment phase?", "options": ["Collecting training data", "Making the trained model available for use in production", "Cleaning and preprocessing data", "Selecting appropriate algorithms"], "correctAnswer": 1, "explanation": "Deployment involves making a trained model available for use in production environments where it can process real-world data and provide predictions. This includes setting up APIs, scaling infrastructure, and monitoring performance.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-045", "question": "Hyperparameter tuning is the process of:", "options": ["Selecting the best features for a model", "Optimizing model configuration parameters", "Adjusting the learning rate during training only", "Cleaning the training data"], "correctAnswer": 1, "explanation": "Hyperparameter tuning involves optimizing the configuration parameters that govern the training process (like learning rate, number of layers, or regularization strength) to find the best model performance.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-046", "question": "A self-driving car learning to navigate through trial and error represents which type of machine learning?", "options": ["Supervised learning", "Unsupervised learning", "Reinforcement learning", "Transfer learning"], "correctAnswer": 2, "explanation": "A self-driving car learning through trial and error is an example of reinforcement learning. The agent (car) learns optimal actions by receiving rewards or penalties based on its performance in the environment.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-047", "question": "What does normalization of data typically involve?", "options": ["Adding more data samples", "Scaling features to a standard range like 0 to 1", "Removing duplicate records", "Encrypting sensitive values"], "correctAnswer": 1, "explanation": "Normalization scales features to a standard range (typically 0-1 or -1 to 1), ensuring that features with different scales contribute equally to the model. This improves training stability and convergence speed.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-048", "question": "Which machine learning technique is most appropriate for segmenting customers into distinct groups based on purchasing behavior?", "options": ["Linear regression", "Clustering", "Binary classification", "Time series forecasting"], "correctAnswer": 1, "explanation": "Clustering is ideal for customer segmentation as it groups similar customers together without predefined categories. The algorithm discovers natural segments based on purchasing patterns and behavioral similarities.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-049", "question": "What is the primary purpose of a loss function in machine learning?", "options": ["To store model parameters", "To measure how well the model predictions match actual values", "To increase the model size", "To encrypt the training data"], "correctAnswer": 1, "explanation": "A loss function measures the difference between model predictions and actual target values, quantifying model error. During training, the model adjusts its parameters to minimize this loss, improving prediction accuracy.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-050", "question": "In deep learning, what are convolutional neural networks (CNNs) primarily used for?", "options": ["Processing sequential data like time series", "Analyzing visual and spatial data like images", "Translating between languages", "Sorting tabular data"], "correctAnswer": 1, "explanation": "Convolutional Neural Networks (CNNs) are designed for processing grid-like data such as images. They use convolution operations to detect local patterns and features, making them highly effective for computer vision tasks.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-051", "question": "What is Azure Machine Learning?", "options": ["A Python library for data visualization", "A cloud service for building, training, and deploying ML models", "A hardware device for AI processing", "A database for storing AI training data"], "correctAnswer": 1, "explanation": "Azure Machine Learning is a cloud-based service that provides tools and frameworks for data scientists and developers to build, train, and deploy machine learning models at scale. It includes features like automated ML, visual drag-and-drop designer, and managed compute resources.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-052", "question": "What is the purpose of an Azure Machine Learning workspace?", "options": ["To store only trained ML models", "To provide a centralized place for all ML resources and experiments", "To execute Python code locally", "To monitor Azure subscription billing"], "correctAnswer": 1, "explanation": "An Azure Machine Learning workspace is the top-level resource that provides a centralized place to work with all the artifacts you create when using Azure Machine Learning. It stores experiments, compute targets, models, pipelines, and datasets.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-053", "question": "What is Automated Machine Learning (AutoML) in Azure?", "options": ["A manual process for feature engineering", "A service that automatically trains and tunes multiple ML models", "A tool for labeling data manually", "A service for deploying VMs automatically"], "correctAnswer": 1, "explanation": "Automated Machine Learning (AutoML) in Azure automatically trains and tunes multiple machine learning models using your data. It iterates through different algorithms and hyperparameters to find the best model for your specific dataset and prediction task.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-054", "question": "What type of machine learning task is predicting house prices?", "options": ["Classification", "Regression", "Clustering", "Anomaly detection"], "correctAnswer": 1, "explanation": "Predicting house prices is a regression task because it involves predicting a continuous numerical value. Classification predicts discrete categories, clustering groups similar items, and anomaly detection identifies outliers.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-055", "question": "What type of machine learning task is identifying spam emails?", "options": ["Classification", "Regression", "Clustering", "Forecasting"], "correctAnswer": 0, "explanation": "Identifying spam emails is a classification task because it involves predicting discrete categories (spam or not spam). Classification algorithms categorize input data into predefined classes.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-056", "question": "What is the Azure ML Designer?", "options": ["A code editor for Python scripts", "A drag-and-drop interface for building ML pipelines", "A tool for designing database schemas", "A dashboard for monitoring Azure costs"], "correctAnswer": 1, "explanation": "Azure ML Designer is a drag-and-drop interface that allows you to build machine learning pipelines visually. You can connect datasets and modules to create ML workflows without writing code.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-057", "question": "What is a compute instance in Azure Machine Learning?", "options": ["A virtual machine for development and experimentation", "A storage account for model artifacts", "A database for training data", "A networking component for security"], "correctAnswer": 0, "explanation": "A compute instance in Azure Machine Learning is a managed cloud-based workstation (virtual machine) used for development and experimentation. It provides a pre-configured environment for data scientists to write code, run notebooks, and train models.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-058", "question": "What is a compute cluster in Azure Machine Learning?", "options": ["A single virtual machine for development", "A scalable cluster of VMs for training models at scale", "A storage solution for datasets", "A network security group"], "correctAnswer": 1, "explanation": "A compute cluster in Azure Machine Learning is a managed cluster of virtual machines that can scale up and down automatically. It is used for training machine learning models at scale and supports distributed training across multiple nodes.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-059", "question": "What is the purpose of feature engineering in machine learning?", "options": ["To deploy models to production", "To create new features or transform existing ones to improve model performance", "To monitor model performance in real-time", "To label training data manually"], "correctAnswer": 1, "explanation": "Feature engineering is the process of creating new features or transforming existing features to improve machine learning model performance. It involves selecting, modifying, or creating variables that help the model learn patterns more effectively.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-060", "question": "What is the difference between training data and test data?", "options": ["Training data is used to train the model; test data is used to evaluate model performance", "Training data is newer than test data", "Test data is used for feature engineering only", "There is no difference between them"], "correctAnswer": 0, "explanation": "Training data is used to train the machine learning model, allowing it to learn patterns. Test data is held separate and used to evaluate how well the model generalizes to unseen data, providing an unbiased assessment of model performance.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-061", "question": "What is model overfitting?", "options": ["When a model performs well on training data but poorly on new data", "When a model is too simple to capture patterns", "When training takes too long", "When a model uses too little data"], "correctAnswer": 0, "explanation": "Overfitting occurs when a machine learning model learns the training data too well, including its noise and outliers, resulting in poor generalization to new, unseen data. The model essentially memorizes the training data rather than learning generalizable patterns.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-062", "question": "What is a real-time inference endpoint in Azure Machine Learning?", "options": ["A storage location for training datasets", "A deployed model service that provides immediate predictions for single requests", "A compute resource for batch processing", "A tool for data visualization"], "correctAnswer": 1, "explanation": "A real-time inference endpoint in Azure Machine Learning is a deployed web service that provides immediate predictions for individual requests. It is designed for low-latency scenarios where quick responses are needed, such as web applications or mobile apps.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-063", "question": "What is batch inference in Azure Machine Learning?", "options": ["Training a model on small batches of data", "Processing large volumes of data asynchronously to generate predictions", "Validating training data in batches", "Deploying models one at a time"], "correctAnswer": 1, "explanation": "Batch inference (or batch scoring) in Azure Machine Learning is the process of using a trained model to generate predictions on large volumes of data asynchronously. It is ideal for scenarios that do not require immediate responses, such as nightly report generation.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-064", "question": "What is the purpose of model monitoring in Azure Machine Learning?", "options": ["To track training data changes over time", "To detect performance degradation and data drift in deployed models", "To monitor Azure subscription costs only", "To manage user access permissions"], "correctAnswer": 1, "explanation": "Model monitoring in Azure Machine Learning helps track the performance of deployed models over time and detect issues like data drift (when the input data distribution changes) or model degradation. This enables proactive model retraining and maintenance.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-065", "question": "What is data drift in machine learning?", "options": ["When training data is accidentally deleted", "When the statistical properties of input data change over time", "When models are deployed to different regions", "When compute resources are scaled automatically"], "correctAnswer": 1, "explanation": "Data drift (also called feature drift or covariate shift) occurs when the statistical properties of the input data change over time compared to the data the model was trained on. This can cause model performance to degrade, requiring model retraining.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-066", "question": "A retail company wants to predict next month's sales based on historical data. Which Azure ML task type should they use?", "options": ["Classification", "Regression", "Forecasting", "Clustering"], "correctAnswer": 2, "explanation": "Forecasting is the appropriate task type for predicting future values based on time-series historical data. While regression predicts continuous values, forecasting specifically handles time-dependent patterns and seasonality in data, making it ideal for sales predictions.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts", "azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-067", "question": "A healthcare organization needs to classify X-ray images as normal or abnormal. Which Azure ML capability is most suitable?", "options": ["Automated ML for computer vision", "Azure ML Designer for text analytics", "Batch inference for tabular data", "Azure ML pipelines for data ingestion"], "correctAnswer": 0, "explanation": "Automated ML for computer vision is the most suitable capability for image classification tasks like analyzing X-rays. Azure AutoML supports image classification, object detection, and image segmentation, making it ideal for medical imaging scenarios.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques", "azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-068", "question": "A data scientist wants to experiment with different algorithms without writing code. Which Azure ML tool should they use?", "options": ["Azure ML SDK for Python", "Azure ML Designer", "Azure DevOps", "Azure Data Factory"], "correctAnswer": 1, "explanation": "Azure ML Designer provides a visual, drag-and-drop interface for building machine learning pipelines without writing code. It allows data scientists to experiment with different algorithms, preprocessing steps, and model configurations visually.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-069", "question": "A company needs to process millions of customer records nightly to generate risk scores. Which deployment approach should they use?", "options": ["Real-time inference endpoint", "Batch inference pipeline", "Compute instance for interactive scoring", "Azure ML Designer web service"], "correctAnswer": 1, "explanation": "Batch inference is the appropriate approach for processing large volumes of data asynchronously. It is designed for scenarios like nightly processing jobs where immediate responses are not required, and large datasets need to be scored efficiently.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-070", "question": "An e-commerce company wants to provide instant product recommendations as customers browse. Which deployment option is best?", "options": ["Batch inference scheduled hourly", "Real-time inference endpoint", "Azure ML compute cluster for training", "Azure ML Designer offline scoring"], "correctAnswer": 1, "explanation": "A real-time inference endpoint is the best choice for providing instant product recommendations. It offers low-latency predictions for individual requests, making it ideal for interactive scenarios where users need immediate responses during browsing.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-071", "question": "What is the primary benefit of using Automated ML for a classification problem?", "options": ["It eliminates the need for any data preparation", "It automatically tries multiple algorithms and hyperparameters to find the best model", "It guarantees 100% accuracy on test data", "It requires no compute resources"], "correctAnswer": 1, "explanation": "Automated ML automatically iterates through multiple machine learning algorithms and hyperparameter combinations to find the best-performing model for your data. It saves time and expertise by automating the model selection and tuning process.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-072", "question": "A financial institution notices their loan default prediction model is performing poorly on recent data. What might be the issue?", "options": ["The model needs more compute resources", "Data drift has occurred due to changing economic conditions", "The training data was too large", "The model was trained for too many epochs"], "correctAnswer": 1, "explanation": "Poor performance on recent data often indicates data drift, where the statistical properties of the input data have changed over time. In this case, changing economic conditions may have altered loan applicant profiles, making the original model less accurate.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-073", "question": "What is the purpose of splitting data into training, validation, and test sets?", "options": ["To reduce the total amount of data used", "To train on one subset, tune hyperparameters on another, and evaluate final performance on unseen data", "To create backup copies of the dataset", "To comply with data privacy regulations"], "correctAnswer": 1, "explanation": "The three-way split allows you to train the model on the training set, tune hyperparameters and select models using the validation set, and then get an unbiased final performance estimate on the completely unseen test set. This prevents overfitting to the test data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-074", "question": "Which metric would be most appropriate for evaluating a fraud detection model?", "options": ["Mean Absolute Error (MAE)", "R-squared", "Precision and Recall", "Mean Squared Error (MSE)"], "correctAnswer": 2, "explanation": "Precision and Recall are the most appropriate metrics for fraud detection, which is an imbalanced classification problem. Precision measures how many predicted frauds are actual frauds, while recall measures how many actual frauds are correctly identified. MAE, MSE, and R-squared are regression metrics.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-075", "question": "A data scientist is preparing data for a machine learning model. Which preprocessing step is typically required for numerical features?", "options": ["One-hot encoding", "Normalization or standardization", "Tokenization", "Text vectorization"], "correctAnswer": 1, "explanation": "Normalization or standardization is typically required for numerical features to ensure all features are on a similar scale. This helps many machine learning algorithms converge faster and perform better. One-hot encoding is for categorical data, while tokenization and text vectorization are for text data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-076", "question": "What is the difference between a compute instance and a compute cluster in Azure ML?", "options": ["Compute instances are for training; compute clusters are for storage", "Compute instances are single VMs for development; compute clusters are scalable multi-node resources for training at scale", "Compute instances are free; compute clusters are paid", "Compute instances run Windows; compute clusters run Linux"], "correctAnswer": 1, "explanation": "Compute instances are single virtual machines designed for interactive development and experimentation. Compute clusters are scalable, multi-node resources that automatically scale up and down and are designed for training models at scale, including distributed training.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-077", "question": "A company wants to categorize customer support tickets by urgency (High, Medium, Low). What type of machine learning problem is this?", "options": ["Regression", "Binary classification", "Multiclass classification", "Clustering"], "correctAnswer": 2, "explanation": "This is a multiclass classification problem because there are three distinct categories (High, Medium, Low) to predict. Binary classification only handles two classes, regression predicts continuous values, and clustering is unsupervised without predefined labels.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-078", "question": "What is cross-validation in machine learning?", "options": ["Validating data across different cloud regions", "A technique that splits data into multiple folds for more robust model evaluation", "Checking if the model works on different operating systems", "Validating data formats before ingestion"], "correctAnswer": 1, "explanation": "Cross-validation is a technique where the dataset is divided into multiple folds. The model is trained on different subsets and validated on the remaining data, rotating through all folds. This provides a more robust estimate of model performance, especially with limited data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-079", "question": "A manufacturing company wants to predict when equipment will fail based on sensor data. What type of machine learning approach is most appropriate?", "options": ["Image classification", "Time-series forecasting or anomaly detection", "Text sentiment analysis", "Recommendation system"], "correctAnswer": 1, "explanation": "Predictive maintenance using sensor data typically employs time-series forecasting or anomaly detection. These approaches can identify patterns that precede failures or detect anomalous readings that indicate impending equipment problems.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-080", "question": "What is the purpose of a validation dataset in machine learning?", "options": ["To train the initial model", "To tune hyperparameters and select the best model without touching the test set", "To store backup copies of training data", "To validate data formats are correct"], "correctAnswer": 1, "explanation": "The validation dataset is used during the training process to tune hyperparameters and compare different models. It helps prevent overfitting to the test set by providing an independent dataset for model selection before final evaluation on the test set.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-081", "question": "Which AutoML task type should be used to predict customer churn (will leave/stay)?", "options": ["Regression", "Binary classification", "Multiclass classification", "Forecasting"], "correctAnswer": 1, "explanation": "Customer churn prediction is a binary classification problem because there are two possible outcomes: the customer will either churn (leave) or not churn (stay). Binary classification is used when predicting between exactly two classes.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-082", "question": "What is a pipeline in Azure Machine Learning?", "options": ["A physical network connection between data centers", "A workflow that orchestrates multiple machine learning steps such as data preparation, training, and deployment", "A storage container for model artifacts", "A single training script execution"], "correctAnswer": 1, "explanation": "An Azure ML pipeline is a workflow that orchestrates multiple machine learning steps, such as data preparation, feature engineering, model training, evaluation, and deployment. Pipelines enable reusable, reproducible, and automated ML workflows.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-083", "question": "A company has imbalanced data where only 1% of transactions are fraudulent. What technique can help address this?", "options": ["Using only accuracy as the evaluation metric", "Applying class balancing techniques like SMOTE or adjusting class weights", "Removing all non-fraudulent transactions", "Using regression instead of classification"], "correctAnswer": 1, "explanation": "For imbalanced datasets, techniques like SMOTE (Synthetic Minority Over-sampling Technique) or adjusting class weights help the model learn from the minority class (fraud cases) more effectively. Using accuracy alone is misleading with imbalanced data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-084", "question": "What is the purpose of registering a model in Azure Machine Learning?", "options": ["To delete old model versions", "To version, store, and manage trained models for deployment and tracking", "To convert models to different programming languages", "To compress model file sizes"], "correctAnswer": 1, "explanation": "Model registration in Azure ML allows you to version, store, and manage trained models in a central repository. Registered models can be tracked, compared, and deployed to various endpoints. This enables model governance and reproducibility.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-085", "question": "What is an experiment in Azure Machine Learning?", "options": ["A failed model training attempt", "A container for multiple related training runs and their outputs", "A production deployment of a model", "A type of compute resource"], "correctAnswer": 1, "explanation": "An experiment in Azure ML is a container for multiple related training runs. It helps organize and track different iterations of model training, including parameters, metrics, and outputs, making it easier to compare approaches and reproduce results.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-086", "question": "Which metric should be used to evaluate a regression model that predicts house prices?", "options": ["Accuracy", "Precision", "Root Mean Squared Error (RMSE)", "F1 Score"], "correctAnswer": 2, "explanation": "Root Mean Squared Error (RMSE) is appropriate for evaluating regression models. It measures the average magnitude of prediction errors, penalizing larger errors more heavily. Accuracy, precision, and F1 score are classification metrics, not suitable for continuous value prediction.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-087", "question": "A data team wants to automatically retrain their model weekly with new data. Which Azure ML feature supports this?", "options": ["Compute instances only", "Azure ML pipelines with scheduling", "Real-time endpoints", "Model registration"], "correctAnswer": 1, "explanation": "Azure ML pipelines with scheduling enable automated, recurring execution of machine learning workflows. This allows teams to set up automated retraining pipelines that run on a schedule (e.g., weekly) to incorporate new data and maintain model performance.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-088", "question": "What is the primary purpose of feature selection in machine learning?", "options": ["To select the best machine learning algorithm", "To identify and keep only the most relevant input variables for model training", "To choose the optimal compute resources", "To select test data samples"], "correctAnswer": 1, "explanation": "Feature selection is the process of identifying and selecting a subset of the most relevant input features for model training. It helps reduce overfitting, improve model performance, reduce training time, and make models more interpretable by removing irrelevant or redundant features.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-089", "question": "A retail company wants to group customers with similar purchasing behavior without predefined categories. Which technique should they use?", "options": ["Supervised classification", "Clustering", "Regression analysis", "Time-series forecasting"], "correctAnswer": 1, "explanation": "Clustering is an unsupervised learning technique that groups similar data points together without predefined labels. It is ideal for customer segmentation where natural groupings in purchasing behavior need to be discovered rather than predicted from known categories.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-090", "question": "What is hyperparameter tuning in machine learning?", "options": ["Adjusting the parameters learned during training", "Optimizing the configuration settings that control the training process", "Tuning the database connection parameters", "Adjusting network bandwidth for training"], "correctAnswer": 1, "explanation": "Hyperparameter tuning (or hyperparameter optimization) is the process of finding the optimal configuration settings that control the learning process, such as learning rate, number of trees in a random forest, or regularization strength. These are different from model parameters, which are learned during training.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "medium", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-091", "question": "A data science team has deployed a model to production and notices performance degrading over three months while data distribution appears stable. What is the most likely cause?", "options": ["Concept drift - the relationship between inputs and outputs has changed", "Data drift - the input data distribution has changed", "Insufficient training epochs", "The model is underfitting"], "correctAnswer": 0, "explanation": "When model performance degrades despite stable input data distribution, concept drift is likely occurring. Concept drift happens when the underlying relationship between input features and the target variable changes over time. This is different from data drift, which involves changes in input feature distributions.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-092", "question": "An insurance company is building a claims fraud detection system. They have 100,000 claims with only 500 confirmed fraud cases. Which approach combination is most appropriate?", "options": ["Use accuracy as the primary metric and standard cross-validation", "Use precision/recall/F1 with stratified sampling and class weighting or SMOTE", "Treat it as a regression problem predicting fraud amount", "Remove majority class samples to create a balanced dataset of 1,000 records"], "correctAnswer": 1, "explanation": "For severely imbalanced data (0.5% fraud rate), precision, recall, and F1 score are more appropriate metrics than accuracy. Stratified sampling ensures both classes are represented in train/test splits, and class weighting or SMOTE helps the model learn from the minority class without discarding valuable majority class data.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-093", "question": "A manufacturing company has sensor data from 1,000 machines collected every minute for a year. They want to predict failures 24 hours in advance. What ML approach is most suitable?", "options": ["Simple binary classification on individual sensor readings", "Time-series forecasting or survival analysis with feature engineering for temporal patterns", "Image classification of sensor dashboards", "Clustering machines by location only"], "correctAnswer": 1, "explanation": "Predicting equipment failures with time-series sensor data requires capturing temporal patterns and trends. Time-series forecasting or survival analysis with appropriate feature engineering (rolling averages, time-based features, degradation trends) is most suitable. Simple classification on individual readings would miss the temporal degradation patterns.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques", "azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-094", "question": "A data scientist is comparing two models: Model A has 95% accuracy on training data but 78% on test data. Model B has 85% accuracy on both. Which statement is correct?", "options": ["Model A is better because it has higher training accuracy", "Model B is likely better because it generalizes better to unseen data", "Both models are equivalent in performance", "Neither model is usable"], "correctAnswer": 1, "explanation": "Model A is overfitting (large gap between training and test performance), while Model B generalizes better with consistent performance on both datasets. Better generalization to unseen data is more important than high training accuracy, making Model B the preferred choice for production deployment.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-core-concepts", "azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-095", "question": "In Azure ML Designer, a data scientist connects a \"Clean Missing Data\" module before the \"Split Data\" module. What is the primary reason for this sequence?", "options": ["Missing data must be cleaned before splitting to prevent data leakage", "The Split Data module cannot handle missing values", "It is required by Azure ML Designer syntax", "Missing data cleaning is only possible on training data"], "correctAnswer": 0, "explanation": "Data preprocessing like cleaning missing values should be done before splitting data to ensure consistent handling across all subsets and prevent data leakage. If splitting occurred first, the preprocessing parameters (e.g., imputation values) calculated on training data might not match test data treatment, leading to inconsistent model evaluation.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services", "azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-096", "question": "A company runs AutoML experiments with different validation configurations. With 10,000 rows of time-series sales data spanning 5 years, which validation approach is most appropriate?", "options": ["Random k-fold cross-validation", "Time-series cross-validation respecting temporal order", "Hold-out validation with random 80/20 split ignoring dates", "Monte Carlo validation with random sampling"], "correctAnswer": 1, "explanation": "For time-series data, validation must respect temporal order to simulate real-world forecasting scenarios. Time-series cross-validation uses a rolling window approach where training data always precedes validation data. Random validation would cause data leakage by using future information to predict the past.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques", "azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-097", "question": "A deployed model's inference latency has increased from 50ms to 500ms over time. Investigation shows the endpoint receives more requests but hardware utilization remains low. What is the most likely cause?", "options": ["The model needs to be retrained with newer data", "Request queuing due to insufficient concurrency or instance count", "Data drift affecting prediction accuracy", "The model file size has increased"], "correctAnswer": 1, "explanation": "Low hardware utilization with increased latency typically indicates a concurrency bottleneck. Requests are queuing up waiting to be processed because the endpoint configuration (concurrent requests per node or number of instances) is insufficient for the increased load, even though the underlying hardware is not fully utilized.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-098", "question": "A data science team needs to compare Random Forest, XGBoost, and Neural Network models for a tabular classification problem while ensuring reproducibility. What Azure ML approach best supports this?", "options": ["Run each model manually in separate notebooks without logging", "Use Automated ML with experiment logging and model registry for comparison", "Train all models on the full dataset without validation", "Use the same random seed but different training datasets"], "correctAnswer": 1, "explanation": "Automated ML systematically explores multiple algorithms, automatically logs all experiments with parameters and metrics, and registers models for comparison. This ensures reproducibility through versioned code, tracked experiments, and registered models. Manual approaches lack proper tracking and comparability.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services", "azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-099", "question": "An e-commerce company wants to predict customer lifetime value (CLV) and identify which factors most influence high-value customers. Which combination of techniques is most appropriate?", "options": ["Binary classification with feature importance analysis", "Regression for CLV prediction combined with feature importance or SHAP values", "Clustering only without prediction", "Anomaly detection to find high-value outliers"], "correctAnswer": 1, "explanation": "Customer Lifetime Value is a continuous variable best predicted with regression. Feature importance metrics (from tree-based models) or SHAP (SHapley Additive exPlanations) values help identify which factors most influence high CLV predictions, providing actionable business insights alongside predictions.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-techniques", "azure-ml-core-concepts"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-100", "question": "A financial institution must explain why a loan application was rejected by their ML model to comply with regulations. Which Azure ML capability best addresses this requirement?", "options": ["Model registration only", "Model interpretability features and responsible AI dashboard for explainability", "Real-time endpoint logging", "Batch inference pipelines"], "correctAnswer": 1, "explanation": "Model interpretability features and the Responsible AI dashboard in Azure ML provide explanations for model predictions, including feature importance and SHAP values. These capabilities help meet regulatory requirements for explainable AI by showing which factors influenced specific loan decisions and ensuring fair, transparent outcomes.", "exams": ["azure-ai-900"], "category": "azure-ml-fundamentals", "topics": ["azure-ml-services", "azure-ml-techniques"], "difficulty": "hard", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-101", "question": "Which Azure service is best for detecting objects in images?", "options": ["Azure Bot Service", "Azure AI Vision", "Azure Synapse Analytics", "Azure DevOps"], "correctAnswer": 1, "explanation": "Azure AI Vision (formerly Computer Vision) provides capabilities for image analysis including object detection, image classification, and tagging. It can identify objects, people, scenes, and activities in images.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-102", "question": "What does OCR stand for in the context of computer vision?", "options": ["Optical Character Recognition", "Object Classification and Retrieval", "Optical Color Rendering", "Object Capture and Recognition"], "correctAnswer": 0, "explanation": "OCR stands for Optical Character Recognition, which is the technology used to convert images of typed, handwritten, or printed text into machine-encoded text. Azure AI Vision provides OCR capabilities through the Read API.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-services"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-103", "question": "Which Azure service would you use to build a custom image classification model for identifying specific types of manufacturing defects?", "options": ["Azure AI Vision", "Azure Custom Vision", "Azure Face Service", "Azure AI Document Intelligence"], "correctAnswer": 1, "explanation": "Azure Custom Vision allows you to build, deploy, and improve your own custom image classification and object detection models. You train the model with your own labeled images to recognize specific content relevant to your business domain.", "exams": ["azure-ai-900"], "category": "azure-computer-vision", "topics": ["azure-vision-solutions"], "difficulty": "easy", "lastUpdated": "2026-03-01"}, {"id": "azure-ai-900-q-104", "question": "What is the primary purpose of facial detection in computer vision?", "options": ["To verify a person's identity against a database", "To locate and identify human faces in images or video", "To analyze emotional expressions on faces", "To compare two faces and determine if they match"], "correctAnswer": 1, "explanation": "Facial detection is the process of locating and identifying human faces within digital images or video streams. It simply finds where faces are located in an image, without identifying who the person is. Identity verification and comparison are functions of facial recognition.", "exam
