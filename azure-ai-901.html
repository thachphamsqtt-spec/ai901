const ALL = [{"id": "azure-ai-901-001", "question": "Which two skill domains make up the Microsoft AI-901 exam blueprint?", "options": ["Identify AI concepts and responsibilities, and Implement AI solutions by using Microsoft Foundry", "Machine learning operations, and Data engineering on Azure", "Designing Azure infrastructure, and Securing Azure networks", "Power Platform automation, and Microsoft 365 administration"], "correctAnswer": 0, "explanation": "The refreshed AI-901 exam is organized into two skill areas: Identify AI concepts and responsibilities (40-45%) and Implement AI solutions by using Microsoft Foundry (55-60%). The first is conceptual and the second is hands-on with the Foundry platform.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["exam-blueprint"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Machine learning operations and data engineering are covered in role-based exams such as DP-100, not in the fundamentals-level AI-901.", "2": "Infrastructure and network security are Azure administrator topics (AZ-104, AZ-500), not the AI fundamentals blueprint.", "3": "Power Platform and Microsoft 365 administration are separate certification tracks unrelated to AI-901."}}, {"id": "azure-ai-901-002", "question": "What is the unified Microsoft platform for building and deploying AI applications and agents that AI-901 is built around?", "options": ["Microsoft Foundry", "Microsoft Power BI", "Microsoft Sentinel", "Microsoft Defender"], "correctAnswer": 0, "explanation": "Microsoft Foundry (previously Azure AI Foundry and Azure AI Studio) is Microsoft's unified platform for building, deploying, and managing AI applications and agents on Azure. The AI-901 exam was redesigned around Foundry as the primary developer experience.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["microsoft-foundry"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Power BI is a business analytics and data visualization tool, not an AI application development platform.", "2": "Microsoft Sentinel is a cloud-native SIEM and security analytics service, not an AI app-building platform.", "3": "Microsoft Defender is a security product family, not the AI development platform AI-901 covers."}}, {"id": "azure-ai-901-003", "question": "Which responsible AI principle is most directly concerned with ensuring an AI system treats all groups of people equitably?", "options": ["Fairness", "Transparency", "Accountability", "Reliability and safety"], "correctAnswer": 0, "explanation": "Fairness means an AI system should treat all people equitably and avoid discriminating against groups based on attributes such as gender, ethnicity, or age. Microsoft's responsible AI principles include fairness, reliability and safety, privacy and security, inclusiveness, transparency, and accountability.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["fairness"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Transparency is about making AI systems understandable, not about equitable treatment across groups.", "2": "Accountability is about people being responsible for AI systems, not directly about equitable treatment.", "3": "Reliability and safety concern consistent, safe operation, not equitable treatment of demographic groups."}}, {"id": "azure-ai-901-004", "question": "A bank wants to make sure its loan-approval AI model does not disadvantage applicants based on ethnicity. Which responsible AI principle does this address?", "options": ["Fairness", "Inclusiveness", "Privacy and security", "Transparency"], "correctAnswer": 0, "explanation": "Ensuring a model does not discriminate against people based on attributes like ethnicity is the core of the fairness principle. Tools such as Fairlearn help assess and mitigate fairness issues in models.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["fairness"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Inclusiveness focuses on empowering people with disabilities and diverse backgrounds, not specifically on non-discriminatory model outputs.", "2": "Privacy and security concern protecting data, not equitable treatment across ethnic groups.", "3": "Transparency concerns explaining how the system works, not preventing biased outcomes."}}, {"id": "azure-ai-901-005", "question": "Which responsible AI principle requires that AI systems should perform consistently and operate safely even in unexpected conditions?", "options": ["Reliability and safety", "Inclusiveness", "Accountability", "Fairness"], "correctAnswer": 0, "explanation": "Reliability and safety means AI systems should work consistently as designed, respond safely to new situations, and resist harmful manipulation. Rigorous testing and monitoring support this principle.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["reliability-safety"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Inclusiveness is about empowering everyone, including people with disabilities, not about consistent safe operation.", "2": "Accountability is about human responsibility for systems, not the system's operational consistency.", "3": "Fairness is about equitable treatment, not safe and consistent operation."}}, {"id": "azure-ai-901-006", "question": "An AI system must protect personal data and give users control over how their information is used. Which responsible AI principle applies?", "options": ["Privacy and security", "Transparency", "Reliability and safety", "Accountability"], "correctAnswer": 0, "explanation": "Privacy and security means AI systems must protect data and respect user privacy, securing information against misuse throughout its lifecycle. This includes safeguarding training data and user inputs.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["privacy-security"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Transparency is about explainability, not protecting personal data.", "2": "Reliability and safety concern consistent operation, not data protection.", "3": "Accountability is about human responsibility, not directly about safeguarding personal data."}}, {"id": "azure-ai-901-007", "question": "Designing an AI solution so that it is accessible to people with disabilities best reflects which responsible AI principle?", "options": ["Inclusiveness", "Fairness", "Transparency", "Privacy and security"], "correctAnswer": 0, "explanation": "Inclusiveness means AI systems should empower everyone and engage people across abilities and backgrounds, including accessibility for people with disabilities. It ensures the benefits of AI reach diverse populations.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["inclusiveness"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Fairness is about non-discrimination in outcomes, not specifically accessibility.", "2": "Transparency concerns explainability, not accessibility for people with disabilities.", "3": "Privacy and security concern data protection, not inclusive design."}}, {"id": "azure-ai-901-008", "question": "Users should understand how an AI system reaches its decisions and what its limitations are. Which principle does this describe?", "options": ["Transparency", "Accountability", "Inclusiveness", "Reliability and safety"], "correctAnswer": 0, "explanation": "Transparency means people should be able to understand how AI systems make decisions and be aware of their capabilities and limitations. Clear documentation and explainability tools support this principle.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["transparency"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Accountability is about people being responsible for AI outcomes, not about explaining how decisions are made.", "2": "Inclusiveness is about empowering diverse users, not explainability.", "3": "Reliability and safety concern consistent operation, not understandability of decisions."}}, {"id": "azure-ai-901-009", "question": "Which responsible AI principle states that people, not the AI system itself, must be answerable for how an AI system operates?", "options": ["Accountability", "Transparency", "Fairness", "Privacy and security"], "correctAnswer": 0, "explanation": "Accountability means the people who design and deploy AI systems are responsible for how those systems operate, including meeting legal and ethical standards. Governance frameworks help organizations uphold accountability.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["accountability"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Transparency is about understandability of the system, not about who is answerable for it.", "2": "Fairness concerns equitable treatment, not responsibility for the system.", "3": "Privacy and security concern data protection, not human responsibility for outcomes."}}, {"id": "azure-ai-901-010", "question": "A content team wants to block a generative AI app from producing hateful or violent text. Which Azure capability is designed for this?", "options": ["Azure AI Content Safety", "Azure Monitor", "Azure Key Vault", "Azure Resource Manager"], "correctAnswer": 0, "explanation": "Azure AI Content Safety detects and filters harmful content such as hate, violence, self-harm, and sexual material in both text and images. It supports the responsible AI principles of reliability, safety, and harm mitigation in generative apps.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["content-safety"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Azure Monitor collects telemetry and metrics; it does not filter harmful AI-generated content.", "2": "Azure Key Vault stores secrets and keys; it has no content moderation role.", "3": "Azure Resource Manager deploys and manages resources; it does not screen generated content."}}, {"id": "azure-ai-901-011", "question": "Which statement best describes how a generative AI language model produces its output?", "options": ["It predicts the next token in a sequence based on patterns learned from large amounts of text", "It looks up the exact answer from a fixed database of facts", "It runs a fixed if-then rule set written by engineers", "It searches the live web for each response in real time by default"], "correctAnswer": 0, "explanation": "Generative language models are trained on large text corpora and generate output by predicting the most probable next token given the preceding context. They produce fluent, original text rather than retrieving fixed answers.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["how-models-work"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Models do not look up exact answers from a fixed database; they generate text probabilistically.", "2": "Generative models are not hand-coded rule sets; they learn statistical patterns from data.", "3": "By default a base model does not search the live web; it relies on its trained parameters unless augmented with retrieval."}}, {"id": "azure-ai-901-012", "question": "What is a token in the context of large language models?", "options": ["A chunk of text, such as a word or part of a word, that the model processes", "A security credential used to authenticate to the model", "A billing unit equal to one full conversation", "A pixel block used in image generation"], "correctAnswer": 0, "explanation": "A token is a unit of text, often a word or sub-word fragment, that a language model reads and predicts. Both input prompts and generated output are measured in tokens, which also affect cost and context-window limits.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["tokens"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "An authentication credential is an access token in security contexts, not the language-model token concept asked about here.", "2": "Tokens are not whole conversations; they are small text fragments.", "3": "Pixel blocks relate to image processing, not the text tokens language models use."}}, {"id": "azure-ai-901-013", "question": "Which type of model creates a numeric vector representation of text so that similar meanings are placed close together?", "options": ["An embedding model", "A speech synthesis model", "A reinforcement-only model", "A rule-based parser"], "correctAnswer": 0, "explanation": "Embedding models convert text into dense numeric vectors where semantically similar inputs are near each other in vector space. Embeddings power semantic search and retrieval-augmented generation scenarios.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["embeddings"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A speech synthesis model converts text to audio, not text to semantic vectors.", "2": "Reinforcement learning tunes behavior through rewards; it does not by itself produce semantic text embeddings.", "3": "A rule-based parser applies grammar rules and does not create learned numeric vectors."}}, {"id": "azure-ai-901-014", "question": "What does the temperature parameter control when calling a generative language model?", "options": ["The randomness and creativity of the generated output", "The maximum number of input documents allowed", "The physical CPU temperature of the host", "The number of users who can call the model"], "correctAnswer": 0, "explanation": "Temperature controls how random or deterministic the output is. A low temperature makes responses more focused and predictable, while a higher temperature increases diversity and creativity at the cost of consistency.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["model-parameters"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Temperature does not limit input documents; that relates to context or input handling.", "2": "Temperature is a sampling parameter, not a hardware measurement.", "3": "User concurrency is a deployment or quota concern, not the temperature parameter."}}, {"id": "azure-ai-901-015", "question": "Which parameter limits how long a model's generated response can be?", "options": ["Max tokens", "Temperature", "Top-p", "Frequency penalty"], "correctAnswer": 0, "explanation": "The max tokens setting caps the number of tokens the model can generate in its response, controlling output length and cost. Temperature and top-p instead influence randomness, while frequency penalty discourages repetition.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["model-parameters"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Temperature affects randomness, not the maximum length of output.", "2": "Top-p limits the probability mass sampled from, affecting diversity rather than length.", "3": "Frequency penalty reduces repeated tokens; it does not set a hard length cap."}}, {"id": "azure-ai-901-016", "question": "A model that can accept both text and images as input is best described as which kind of model?", "options": ["A multimodal model", "A unimodal text model", "A regression model", "A clustering model"], "correctAnswer": 0, "explanation": "A multimodal model can process more than one type of input, such as text and images together, and reason across them. These models power scenarios like describing an uploaded photo or answering questions about a chart.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["multimodal-models"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A unimodal text model handles only text, not images.", "2": "A regression model predicts continuous numeric values, not multimodal content.", "3": "A clustering model groups similar data points and does not process images and text as a chat input."}}, {"id": "azure-ai-901-017", "question": "When selecting an AI model in Foundry, which factor is most important to match to your scenario?", "options": ["The model's capabilities, such as text, vision, or reasoning, relative to your task", "The alphabetical order of the model name", "The color of the model's icon in the catalog", "The number of letters in the model's version string"], "correctAnswer": 0, "explanation": "Choosing a model should be driven by whether its capabilities match the task, such as text generation, multimodal vision, embeddings, or reasoning, balanced against cost and performance. Cosmetic details like icons or naming are irrelevant.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["model-selection"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Alphabetical order has no bearing on whether a model fits the task.", "2": "Icon color is cosmetic and not a selection criterion.", "3": "The length of a version string is meaningless for model selection."}}, {"id": "azure-ai-901-018", "question": "Which workload is the best example of generative AI?", "options": ["Producing a draft marketing email from a short prompt", "Classifying an image as a cat or a dog", "Detecting fraud in a transaction stream", "Forecasting next month's sales from historical data"], "correctAnswer": 0, "explanation": "Generative AI creates new content such as text, images, or code. Drafting an email from a prompt is generative, whereas image classification, fraud detection, and forecasting are predictive or analytical workloads.", "exams": ["azure-ai-901"], "category": "ai-workloads", "topics": ["generative-ai-workload"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Classifying an image is a computer vision classification task, not content generation.", "2": "Fraud detection is anomaly detection or classification, not generative AI.", "3": "Sales forecasting is a predictive regression task, not generative content creation."}}, {"id": "azure-ai-901-019", "question": "What best describes an agentic AI workload?", "options": ["An AI solution that can plan steps and call tools or actions to accomplish a goal", "A static report that summarizes last year's data", "A spreadsheet macro that copies cells", "A manually written FAQ page"], "correctAnswer": 0, "explanation": "An AI agent uses a model to reason about a goal, decide on steps, and invoke tools or functions to carry out tasks. This goes beyond a single response by orchestrating actions toward an objective.", "exams": ["azure-ai-901"], "category": "ai-workloads", "topics": ["agentic-ai-workload"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A static report does not plan or take actions; it is fixed output.", "2": "A spreadsheet macro follows fixed steps without AI reasoning.", "3": "A manually written FAQ involves no autonomous reasoning or tool use."}}, {"id": "azure-ai-901-020", "question": "Identifying whether a customer review expresses positive or negative feeling is an example of which text analysis technique?", "options": ["Sentiment analysis", "Keyword extraction", "Entity detection", "Language detection"], "correctAnswer": 0, "explanation": "Sentiment analysis evaluates text to determine whether the expressed opinion is positive, negative, neutral, or mixed. It is commonly used to gauge customer satisfaction from reviews and social posts.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["sentiment-analysis"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Keyword extraction pulls out key phrases, not the emotional tone.", "2": "Entity detection identifies named items like people or places, not sentiment.", "3": "Language detection identifies which language the text is written in, not its sentiment."}}, {"id": "azure-ai-901-021", "question": "Extracting the most important phrases that summarize what a document is about is known as which technique?", "options": ["Key phrase extraction", "Sentiment analysis", "Speech synthesis", "Translation"], "correctAnswer": 0, "explanation": "Key phrase extraction identifies the main concepts and important terms in a body of text. It helps quickly understand the gist of documents without reading them in full.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["key-phrase-extraction"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Sentiment analysis measures emotional tone, not the main phrases.", "2": "Speech synthesis converts text to audio, not extracting key phrases.", "3": "Translation converts text between languages, not summarizing key concepts."}}, {"id": "azure-ai-901-022", "question": "Recognizing that 'Seattle' is a location and 'Microsoft' is an organization within a sentence is an example of which technique?", "options": ["Named entity recognition", "Sentiment analysis", "Summarization", "Optical character recognition"], "correctAnswer": 0, "explanation": "Named entity recognition (NER) identifies and categorizes entities such as people, places, organizations, dates, and quantities in text. It is a core capability of Azure AI Language.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["entity-recognition"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Sentiment analysis measures opinion polarity, not entity categories.", "2": "Summarization condenses content, it does not label entities.", "3": "Optical character recognition reads text from images, not categorizing entities."}}, {"id": "azure-ai-901-023", "question": "Condensing a long article into a few sentences that capture the main points is which text analysis capability?", "options": ["Summarization", "Entity linking", "Language detection", "Translation"], "correctAnswer": 0, "explanation": "Summarization produces a shorter version of text that retains the essential information. Azure AI Language offers extractive and abstractive summarization for documents and conversations.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["summarization"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Entity linking connects entities to a knowledge base; it does not shorten text.", "2": "Language detection identifies the language used, not a summary.", "3": "Translation changes the language, it does not condense the content."}}, {"id": "azure-ai-901-024", "question": "Which Azure service provides natural language processing features such as sentiment analysis, entity recognition, and summarization?", "options": ["Azure AI Language", "Azure AI Vision", "Azure Cosmos DB", "Azure Virtual Machines"], "correctAnswer": 0, "explanation": "Azure AI Language is the service that delivers text analytics capabilities including sentiment analysis, key phrase extraction, named entity recognition, language detection, and summarization. It is a core part of Azure AI services.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["azure-ai-language"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Azure AI Vision processes images, not text analytics.", "2": "Azure Cosmos DB is a NoSQL database, not a language service.", "3": "Azure Virtual Machines provide compute, not NLP features."}}, {"id": "azure-ai-901-025", "question": "Converting written text into spoken audio is best described as which capability?", "options": ["Speech synthesis (text to speech)", "Speech recognition (speech to text)", "Sentiment analysis", "Translation"], "correctAnswer": 0, "explanation": "Speech synthesis, or text to speech, generates natural-sounding spoken audio from written text. Azure AI Speech offers many neural voices for this purpose.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["speech-synthesis"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Speech recognition does the reverse, turning audio into text.", "2": "Sentiment analysis evaluates emotional tone in text, not audio generation.", "3": "Translation converts between languages, not text into audio."}}, {"id": "azure-ai-901-026", "question": "Transcribing a recorded meeting into written text is an example of which capability?", "options": ["Speech recognition (speech to text)", "Speech synthesis (text to speech)", "Image classification", "Key phrase extraction"], "correctAnswer": 0, "explanation": "Speech recognition, or speech to text, converts spoken audio into a written transcript. It enables transcription, captioning, and voice-driven applications.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["speech-recognition"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Speech synthesis produces audio from text, the opposite direction.", "2": "Image classification labels images, unrelated to audio transcription.", "3": "Key phrase extraction works on text, not converting audio to text."}}, {"id": "azure-ai-901-027", "question": "Which Azure service provides both speech to text and text to speech capabilities?", "options": ["Azure AI Speech", "Azure AI Vision", "Azure AI Language", "Azure Blob Storage"], "correctAnswer": 0, "explanation": "Azure AI Speech provides speech recognition (speech to text), speech synthesis (text to speech), and speech translation. It is part of the Azure AI services family, now called Foundry Tools.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["azure-ai-speech"], "difficulty": "easy", "lastUpdated": "2026-10-28", "wrongExplanations": {"1": "Azure AI Vision handles images, not speech.", "2": "Azure AI Language handles text analytics, not audio processing.", "3": "Azure Blob Storage stores files; it does not process speech."}}, {"id": "azure-ai-901-028", "question": "Detecting where objects are located in an image and drawing bounding boxes around them is which computer vision task?", "options": ["Object detection", "Image classification", "Sentiment analysis", "Speech recognition"], "correctAnswer": 0, "explanation": "Object detection identifies the presence and location of multiple objects in an image, returning bounding box coordinates and labels for each. Image classification, by contrast, assigns a single label to the whole image.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["object-detection"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Image classification labels the whole image, without locating individual objects.", "2": "Sentiment analysis is a text technique, unrelated to images.", "3": "Speech recognition processes audio, not images."}}, {"id": "azure-ai-901-029", "question": "Assigning a single category label such as 'beach' or 'mountain' to an entire photo is which computer vision task?", "options": ["Image classification", "Object detection", "Optical character recognition", "Speech synthesis"], "correctAnswer": 0, "explanation": "Image classification assigns one or more category labels describing the overall content of an image. Object detection differs by locating and labeling individual objects within the image.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["image-classification"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Object detection locates multiple objects, rather than labeling the whole image once.", "2": "Optical character recognition reads text from images, not classifying scenes.", "3": "Speech synthesis produces audio and is unrelated to image labeling."}}, {"id": "azure-ai-901-030", "question": "Reading printed or handwritten text from a scanned receipt is enabled by which computer vision capability?", "options": ["Optical character recognition (OCR)", "Image classification", "Object detection", "Sentiment analysis"], "correctAnswer": 0, "explanation": "Optical character recognition (OCR) detects and extracts text from images and documents, including printed and handwritten content. Azure AI Vision provides OCR through its Read capability.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["ocr"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Image classification assigns scene labels, not reading text.", "2": "Object detection locates objects, not extracting text characters.", "3": "Sentiment analysis evaluates text tone and is not a vision capability."}}, {"id": "azure-ai-901-031", "question": "Which Azure service provides computer vision capabilities such as image analysis, OCR, and object detection?", "options": ["Azure AI Vision", "Azure AI Language", "Azure AI Speech", "Azure Functions"], "correctAnswer": 0, "explanation": "Azure AI Vision provides image analysis, optical character recognition, object detection, and image captioning. It is the computer vision service within Azure AI services.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["azure-ai-vision"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Azure AI Language handles text, not images.", "2": "Azure AI Speech handles audio, not images.", "3": "Azure Functions runs serverless code; it is not a vision service."}}, {"id": "azure-ai-901-032", "question": "Creating a brand-new image from a text description such as 'a red bicycle on a beach at sunset' uses which type of model?", "options": ["An image-generation model", "An object-detection model", "An OCR model", "A regression model"], "correctAnswer": 0, "explanation": "Image-generation models produce new images from text prompts. This is a generative AI computer vision capability, distinct from analyzing or classifying existing images.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["image-generation"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Object detection locates objects in existing images; it does not create new images.", "2": "OCR reads text from images and cannot generate images.", "3": "A regression model predicts numeric values, not images."}}, {"id": "azure-ai-901-033", "question": "Extracting field values such as invoice number, date, and total from a scanned invoice is best handled by which capability?", "options": ["Information extraction from documents", "Speech synthesis", "Image classification", "Sentiment analysis"], "correctAnswer": 0, "explanation": "Extracting structured fields from documents and forms is an information extraction task. In Foundry, Azure Content Understanding extracts data from documents, images, audio, and video.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["document-extraction"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Speech synthesis produces audio, not extracting document fields.", "2": "Image classification labels whole images, not pulling specific field values.", "3": "Sentiment analysis measures tone in text, not extracting structured data."}}, {"id": "azure-ai-901-034", "question": "Which Foundry capability is designed to extract information from documents, images, audio, and video in a unified way?", "options": ["Azure Content Understanding", "Azure Key Vault", "Azure Monitor", "Azure Load Balancer"], "correctAnswer": 0, "explanation": "Azure Content Understanding in Foundry Tools extracts structured information from multiple content types including documents, forms, images, audio, and video. It is the primary information extraction capability assessed on AI-901.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["content-understanding"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Azure Key Vault stores secrets; it does not extract content.", "2": "Azure Monitor collects telemetry, not extracting information from files.", "3": "Azure Load Balancer distributes network traffic; it has no extraction role."}}, {"id": "azure-ai-901-035", "question": "In a chat application, what is the purpose of a system prompt (system message)?", "options": ["To set the model's role, behavior, and constraints before user input is processed", "To store the application's connection string", "To display error logs to the end user", "To increase the GPU memory available to the model"], "correctAnswer": 0, "explanation": "A system prompt instructs the model on its persona, tone, scope, and rules, guiding how it responds to user messages. Well-crafted system messages are key to reliable, on-brand generative AI behavior.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["system-prompt"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Connection strings are configuration, not part of a system prompt's purpose.", "2": "System prompts guide model behavior; they are not for displaying error logs.", "3": "Prompts do not allocate hardware resources like GPU memory."}}, {"id": "azure-ai-901-036", "question": "Providing a few example input-output pairs inside a prompt to guide the model is known as what?", "options": ["Few-shot prompting", "Fine-tuning", "Quantization", "Tokenization"], "correctAnswer": 0, "explanation": "Few-shot prompting includes a small number of examples in the prompt so the model can infer the desired pattern without retraining. Zero-shot prompting provides no examples, while fine-tuning actually updates model weights.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["prompt-engineering"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Fine-tuning retrains the model on data; it is not adding examples within a prompt.", "2": "Quantization reduces model precision for efficiency, unrelated to prompting style.", "3": "Tokenization splits text into tokens; it is not a prompting technique."}}, {"id": "azure-ai-901-037", "question": "What is the main benefit of grounding a generative model with your own data using retrieval-augmented generation (RAG)?", "options": ["It lets the model answer using your specific, up-to-date information instead of only its training data", "It permanently changes the model's internal weights", "It removes the need for any prompt", "It guarantees the model never makes mistakes"], "correctAnswer": 0, "explanation": "RAG retrieves relevant content from your data sources and adds it to the prompt so the model can ground its answers in that information. This improves accuracy and relevance without modifying the base model's weights.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["rag-grounding"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "RAG does not change model weights; that is fine-tuning.", "2": "RAG still relies on a prompt, into which retrieved data is inserted.", "3": "No technique guarantees a model never errs; RAG only reduces hallucination risk."}}, {"id": "azure-ai-901-038", "question": "In Foundry, after selecting a model from the catalog, what must you do before an application can send requests to it?", "options": ["Deploy the model to create an endpoint", "Convert the model to a virtual machine image", "Email Microsoft support for activation", "Print the model card and scan it"], "correctAnswer": 0, "explanation": "In Foundry you deploy a chosen model, which provisions an endpoint and credentials that applications use to call it. Without a deployment there is no endpoint to send inference requests to.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["model-deployment"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Models are deployed as managed endpoints, not converted to VM images by you.", "2": "No support email is required to activate a catalog model.", "3": "Printing or scanning a model card has no effect on availability."}}, {"id": "azure-ai-901-039", "question": "Which tool lets you interactively test prompts against a deployed model directly in the Foundry portal?", "options": ["The chat playground", "Azure Resource Manager templates", "The billing dashboard", "The network security group editor"], "correctAnswer": 0, "explanation": "The chat playground in Foundry provides an interactive interface to test prompts, adjust parameters like temperature, and view responses before writing code. It is the fastest way to experiment with a deployed model.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["foundry-playground"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "ARM templates define infrastructure as code; they are not for testing prompts.", "2": "The billing dashboard shows costs, not prompt testing.", "3": "Network security group editors configure firewall rules, unrelated to prompts."}}, {"id": "azure-ai-901-040", "question": "What does the Foundry SDK primarily enable a developer to do?", "options": ["Write code that connects to and calls deployed models and services in Foundry", "Manually label training images in a browser", "Replace the need for any Azure subscription", "Render 3D graphics for games"], "correctAnswer": 0, "explanation": "The Foundry SDK lets developers programmatically connect to Foundry projects, call deployed models, and build client applications such as chat clients and agents. It abstracts the API calls behind language-specific libraries.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["foundry-sdk"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Image labeling is a data-prep task, not the core purpose of the SDK.", "2": "The SDK still requires an Azure subscription to access resources.", "3": "The SDK is for AI app development, not 3D game rendering."}}, {"id": "azure-ai-901-041", "question": "Which language's coding syntax does the AI-901 study guide expect candidates to be familiar with?", "options": ["Python", "COBOL", "Assembly", "Fortran"], "correctAnswer": 0, "explanation": "The AI-901 audience profile states candidates should know Python coding syntax and programming techniques, since Foundry SDK examples are shown in Python. Familiarity with Azure resources is also expected.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["python-prerequisite"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "COBOL is a legacy business language not referenced by the study guide.", "2": "Assembly is low-level programming not expected for AI fundamentals.", "3": "Fortran is a scientific computing language not part of the prerequisites."}}, {"id": "azure-ai-901-042", "question": "What distinguishes an AI agent from a single chat completion call?", "options": ["An agent can use tools, follow multi-step instructions, and act toward a goal", "An agent can only return a single fixed sentence", "An agent cannot use any model", "An agent runs only on a local laptop with no cloud"], "correctAnswer": 0, "explanation": "An agent combines a model with instructions, tools, and the ability to take actions across multiple steps to accomplish a goal. A single chat completion returns one response without orchestrating tool calls or multi-step reasoning.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["agents"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Agents are not limited to one fixed sentence; they reason and act over many steps.", "2": "Agents are built on top of a model, so they do use models.", "3": "Agents run in the cloud through Foundry, not exclusively on a local laptop."}}, {"id": "azure-ai-901-043", "question": "In Foundry, what are tools (also called actions or functions) in the context of an agent?", "options": ["Capabilities the agent can invoke, such as calling an API or searching data, to complete tasks", "Physical hardware sensors attached to the server", "Email templates sent to administrators", "Static images stored in blob storage"], "correctAnswer": 0, "explanation": "Tools give an agent capabilities beyond text generation, such as calling external APIs, querying data, or running code. The model decides when to invoke a tool to gather information or perform an action toward the goal.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["agent-tools"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Tools are software capabilities the agent calls, not physical sensors.", "2": "Email templates are unrelated to the concept of agent tools.", "3": "Static blob images are not the actionable tools an agent invokes."}}, {"id": "azure-ai-901-044", "question": "A developer wants to build a lightweight chat client that talks to a model deployed in Foundry. Which approach aligns with the AI-901 skills?", "options": ["Use the Foundry SDK to connect to the deployment and send chat messages", "Rewrite the model from scratch in C++", "Train a new foundation model on a single laptop", "Avoid using any code and rely on manual copy-paste only"], "correctAnswer": 0, "explanation": "AI-901 expects candidates to build lightweight client applications using the Foundry SDK to call a deployed model. This is far simpler than training models and is the recommended path for entry-level developers.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["chat-client"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Rewriting a foundation model in C++ is unnecessary and far beyond fundamentals scope.", "2": "Training a foundation model on a laptop is infeasible and not the intended approach.", "3": "Manual copy-paste is not building a client application."}}, {"id": "azure-ai-901-045", "question": "What is a Foundry project used for?", "options": ["To organize the resources, deployments, and connections for an AI solution", "To store unrelated personal photos", "To replace the Azure portal entirely", "To bill customers for Office licenses"], "correctAnswer": 0, "explanation": "A Foundry project is a workspace that groups model deployments, connected resources, data, and tools for building an AI solution. It gives developers a single place to manage everything an application needs.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["foundry-project"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Foundry projects organize AI resources, not personal photo storage.", "2": "A project does not replace the Azure portal; it is a workspace within Azure.", "3": "Billing for Office licenses is unrelated to Foundry projects."}}, {"id": "azure-ai-901-046", "question": "Which prompt would most likely produce reliable, focused output from a generative model?", "options": ["A clear, specific prompt that states the task, desired format, and any constraints", "A single vague word with no context", "A prompt written in random characters", "An empty prompt"], "correctAnswer": 0, "explanation": "Effective prompts are clear and specific, describing the task, expected format, and constraints. Vague or empty prompts give the model little to work with, producing unfocused or unpredictable results.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["prompt-engineering"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A single vague word lacks the detail a model needs for focused output.", "2": "Random characters give the model no meaningful instruction.", "3": "An empty prompt provides no task at all."}}, {"id": "azure-ai-901-047", "question": "What is a hallucination in the context of generative AI?", "options": ["When a model produces confident output that is factually incorrect or fabricated", "When a model refuses to respond entirely", "When the network connection times out", "When the GPU overheats during inference"], "correctAnswer": 0, "explanation": "A hallucination is when a generative model produces plausible-sounding but false or fabricated information. Grounding the model with reliable data through techniques like RAG helps reduce hallucinations.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["hallucination"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A refusal to respond is not a hallucination; hallucination is incorrect generated content.", "2": "A network timeout is an infrastructure issue, not a hallucination.", "3": "GPU overheating is a hardware problem, unrelated to hallucinated output."}}, {"id": "azure-ai-901-048", "question": "Which statement about Azure AI services is correct?", "options": ["They are prebuilt AI capabilities you can call through APIs without training your own models", "They require you to build and train every model from raw data first", "They run only on on-premises hardware", "They are limited to a single language"], "correctAnswer": 0, "explanation": "Azure AI services provide ready-to-use AI capabilities such as vision, language, and speech that developers consume through APIs and SDKs. They remove the need to build and train models from scratch for common tasks.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["azure-ai-services"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "The whole point of Azure AI services is that prebuilt models exist, so you do not train from raw data.", "2": "These services are cloud-based, not limited to on-premises hardware.", "3": "Azure AI services support many languages, not just one."}}, {"id": "azure-ai-901-049", "question": "Translating a sentence from English to Japanese is an example of which NLP capability?", "options": ["Machine translation", "Sentiment analysis", "Object detection", "Optical character recognition"], "correctAnswer": 0, "explanation": "Machine translation converts text or speech from one language to another. Azure provides text translation through Azure Translator (now part of Foundry Tools, formerly Azure AI Translator) and speech translation through Azure AI Speech.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["translation"], "difficulty": "easy", "lastUpdated": "2026-06-23", "wrongExplanations": {"1": "Sentiment analysis measures emotional tone, not language conversion.", "2": "Object detection is a vision task, unrelated to language translation.", "3": "OCR reads text from images; it does not translate between languages."}}, {"id": "azure-ai-901-050", "question": "A multimodal model in Foundry receives a photo of a whiteboard and a question about its contents, then answers. This demonstrates which capability?", "options": ["Interpreting visual input in a prompt", "Generating a brand-new image", "Synthesizing speech from text", "Detecting fraud in transactions"], "correctAnswer": 0, "explanation": "When a multimodal model takes an image plus a text question and reasons about the image content, it is interpreting visual input within a prompt. AI-901 includes interpreting visual input by using a deployed multimodal model.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["multimodal-vision"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Generating a new image is the reverse direction from interpreting an existing one.", "2": "Speech synthesis produces audio, not image interpretation.", "3": "Fraud detection is an analytical task unrelated to interpreting images."}}, {"id": "azure-ai-901-051", "question": "Which scenario is the best fit for an image-generation model?", "options": ["Creating concept artwork for a product from a text description", "Reading the serial number printed on a device", "Counting how many cars appear in a parking-lot photo", "Transcribing a podcast episode"], "correctAnswer": 0, "explanation": "Image-generation models create original images from text prompts, making them ideal for producing concept art or marketing visuals. The other scenarios involve reading, counting, or transcribing existing content, which are analytical tasks.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["image-generation"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Reading a serial number is OCR, not image generation.", "2": "Counting cars is object detection, an analytical task.", "3": "Transcribing a podcast is speech to text, unrelated to image generation."}}, {"id": "azure-ai-901-052", "question": "Using Content Understanding to pull the spoken topics and key moments out of a recorded video is an example of extracting information from what?", "options": ["Audio and video content", "Relational database tables", "Network packet captures", "Source code repositories"], "correctAnswer": 0, "explanation": "Azure Content Understanding can extract information from audio and video, including transcripts, topics, and key moments. AI-901 covers extracting information from text, images, audio, and video.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["audio-video-extraction"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Relational tables are queried with SQL, not extracted by Content Understanding.", "2": "Network packet analysis is a security task, not content understanding.", "3": "Source code is parsed by developer tools, not by media content extraction."}}, {"id": "azure-ai-901-053", "question": "Which capability would best extract handwritten notes and key fields from a stack of scanned forms?", "options": ["Content Understanding document extraction", "Speech recognition", "Image generation", "Sentiment analysis"], "correctAnswer": 0, "explanation": "Extracting fields and text, including handwriting, from scanned forms is a document information extraction task handled by Azure Content Understanding in Foundry. It returns structured data from documents and images.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["document-extraction"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Speech recognition processes audio, not scanned forms.", "2": "Image generation creates new images; it does not read forms.", "3": "Sentiment analysis measures text tone, not extracting form fields."}}, {"id": "azure-ai-901-054", "question": "What is the AI-901 exam fee in the United States?", "options": ["$99 USD", "$165 USD", "$300 USD", "Free"], "correctAnswer": 0, "explanation": "Microsoft fundamentals exams such as AI-901 are priced at $99 USD in the United States, though pricing varies by country and excludes taxes. Role-based exams typically cost more.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["exam-fee"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "$165 is closer to a role-based associate exam price, not the fundamentals fee.", "2": "$300 exceeds the fundamentals price; AI-901 is $99.", "3": "AI-901 is not free; the fee is $99 USD in the US."}}, {"id": "azure-ai-901-055", "question": "What passing score is required on the AI-901 exam?", "options": ["700 out of 1000", "500 out of 1000", "850 out of 1000", "65 out of 100"], "correctAnswer": 0, "explanation": "Microsoft exams, including AI-901, require a score of 700 or greater on a scale of 1 to 1000 to pass. The scaled score is not a simple percentage of correct answers.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["passing-score"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "500 is below the required passing threshold of 700.", "2": "850 is higher than required; the pass mark is 700.", "3": "The score is on a 1000-point scale, not a 100-point percentage."}}, {"id": "azure-ai-901-056", "question": "Who administers and delivers the AI-901 exam?", "options": ["Microsoft, with delivery through Pearson VUE", "Oracle University", "CompTIA testing centers only", "Amazon Web Services"], "correctAnswer": 0, "explanation": "AI-901 is a Microsoft certification exam delivered through Pearson VUE, online or at a test center. Microsoft owns the exam content while Pearson VUE handles scheduling and proctoring.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["exam-provider"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Oracle University runs Oracle exams, not Microsoft's AI-901.", "2": "CompTIA runs its own certifications, not Microsoft Azure exams.", "3": "AWS administers its own certifications, not Microsoft's."}}, {"id": "azure-ai-901-057", "question": "How long is the Microsoft Certified: Azure AI Fundamentals certification valid after passing AI-901?", "options": ["It does not expire because it is a fundamentals certification", "12 months, then it must be retaken", "24 months, then it must be repurchased", "6 months only"], "correctAnswer": 0, "explanation": "Microsoft fundamentals certifications, including Azure AI Fundamentals, do not expire. Only role-based associate, expert, and specialty certifications require annual renewal.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["certification-validity"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Annual renewal applies to role-based and specialty certs, not fundamentals.", "2": "There is no 24-month expiry for fundamentals certifications.", "3": "Fundamentals certifications do not expire after 6 months."}}, {"id": "azure-ai-901-058", "question": "Roughly how much of the AI-901 exam focuses on implementing AI solutions by using Microsoft Foundry?", "options": ["55 to 60 percent", "10 to 15 percent", "5 percent", "90 percent"], "correctAnswer": 0, "explanation": "The official skills-at-a-glance shows Implement AI solutions by using Microsoft Foundry at 55 to 60 percent, making it the larger domain. Identify AI concepts and responsibilities accounts for 40 to 45 percent.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["skill-weights"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "10 to 15 percent understates the largest domain on the exam.", "2": "5 percent is far too low for the Foundry implementation domain.", "3": "90 percent overstates it; the Foundry domain is 55 to 60 percent."}}, {"id": "azure-ai-901-059", "question": "Which conceptual workload would you choose to automatically route incoming support tickets to the right department based on their text?", "options": ["Text classification using natural language processing", "Image generation", "Speech synthesis", "Optical character recognition"], "correctAnswer": 0, "explanation": "Routing tickets based on their wording is a text classification NLP task that assigns categories to text. Azure AI Language supports custom text classification for scenarios like this.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["text-classification"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Image generation creates pictures, not classifying text tickets.", "2": "Speech synthesis produces audio, not categorizing text.", "3": "OCR reads text from images; the tickets are already text needing classification."}}, {"id": "azure-ai-901-060", "question": "A company wants users to ask questions in plain language and get answers drawn from its internal knowledge base. Which approach fits best?", "options": ["A generative AI chat solution grounded on the company's documents", "A static printed manual", "An image-generation model", "A speaker-recognition system"], "correctAnswer": 0, "explanation": "A generative chat solution grounded on internal documents lets users ask natural-language questions and receive answers based on the company's own content. Grounding the model with the knowledge base improves accuracy and relevance.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["rag-grounding"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A static printed manual cannot answer natural-language questions interactively.", "2": "Image generation creates pictures, not knowledge-base answers.", "3": "Speaker recognition identifies who is speaking, not answering content questions."}}, {"id": "azure-ai-901-061", "question": "What does fine-tuning a model involve?", "options": ["Further training a base model on additional examples to adapt it to a specific task", "Restarting the Foundry portal", "Lowering the screen brightness during inference", "Deleting the model from the catalog"], "correctAnswer": 0, "explanation": "Fine-tuning continues training a pretrained model on task-specific examples so it performs better on that task or style. It changes the model's weights, unlike prompting techniques that leave the base model unchanged.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["fine-tuning"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Restarting the portal has nothing to do with adapting a model.", "2": "Screen brightness is unrelated to model training.", "3": "Deleting a model removes it; fine-tuning instead specializes it."}}, {"id": "azure-ai-901-062", "question": "Which of these is the clearest example of where the privacy and security principle must be applied?", "options": ["Ensuring that personal health data sent to a model is encrypted and not exposed", "Choosing a brighter color theme for the app", "Adding more emojis to chatbot replies", "Renaming the deployment to a shorter name"], "correctAnswer": 0, "explanation": "Protecting sensitive personal data, such as health information, with encryption and access controls is a direct application of the privacy and security principle. The other options are cosmetic and unrelated to responsible AI.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["privacy-security"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A color theme is a UI choice, not a privacy or security concern.", "2": "Adding emojis does not relate to protecting data.", "3": "Renaming a deployment has no impact on data privacy."}}, {"id": "azure-ai-901-063", "question": "Which scenario best matches a computer vision workload?", "options": ["Identifying defective parts on a production line from camera images", "Translating a document into French", "Summarizing a news article", "Converting a paragraph into speech"], "correctAnswer": 0, "explanation": "Detecting defects from camera images is a computer vision task that analyzes visual data. Translation, summarization, and text to speech are language and speech workloads, not vision.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["vision-workload"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Translating a document is an NLP task, not computer vision.", "2": "Summarizing an article is a text analysis task.", "3": "Converting text to speech is a speech synthesis task."}}, {"id": "azure-ai-901-064", "question": "What is the role of the context window in a language model?", "options": ["It defines the maximum number of tokens the model can consider at once, including prompt and response", "It sets the physical window size of the app", "It controls how many users can log in", "It determines the model's training duration"], "correctAnswer": 0, "explanation": "The context window is the maximum amount of text, measured in tokens, that a model can take into account in a single interaction, covering both the input and the generated output. Exceeding it forces older content to be truncated.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["context-window"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "It is a token limit, not the physical size of an application window.", "2": "User login counts are quota concerns, not the context window.", "3": "Training duration is unrelated to the context window concept."}}, {"id": "azure-ai-901-065", "question": "Which statement about choosing between a smaller and a larger language model is most accurate?", "options": ["Smaller models can be cheaper and faster, while larger models may handle more complex reasoning", "Larger models are always free and faster", "Smaller models can never answer any question", "Model size has no effect on cost or latency"], "correctAnswer": 0, "explanation": "Model selection involves trade-offs: smaller models often cost less and respond faster, while larger models may offer stronger reasoning at higher cost and latency. Matching the model to the task and budget is part of model selection on AI-901.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["model-selection"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Larger models are usually more expensive and not necessarily faster.", "2": "Smaller models can answer many questions; they are just less capable on complex tasks.", "3": "Model size clearly affects cost and latency."}}, {"id": "azure-ai-901-066", "question": "Which Azure AI Language feature would identify the language a piece of text is written in?", "options": ["Language detection", "Sentiment analysis", "Key phrase extraction", "Summarization"], "correctAnswer": 0, "explanation": "Language detection determines which natural language a text is written in and returns a confidence score. It is useful for routing multilingual content to the right processing pipeline.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["language-detection"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Sentiment analysis measures tone, not which language is used.", "2": "Key phrase extraction pulls main phrases, not detecting the language.", "3": "Summarization condenses content, it does not identify the language."}}, {"id": "azure-ai-901-067", "question": "An app needs to convert a customer's spoken request into text and then have a model respond aloud. Which two capabilities are combined?", "options": ["Speech to text and text to speech", "Object detection and image classification", "OCR and translation", "Embeddings and clustering"], "correctAnswer": 0, "explanation": "Capturing a spoken request requires speech to text, and responding aloud requires text to speech. Together these enable a voice-driven conversational experience, often paired with a multimodal model in Foundry.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["speech-pipeline"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Object detection and image classification are vision tasks, not speech.", "2": "OCR and translation handle text in images and language conversion, not voice interaction.", "3": "Embeddings and clustering are analytical techniques, not a speech pipeline."}}, {"id": "azure-ai-901-068", "question": "Which is a valid reason to deploy an AI model close to where its data resides or in a specific region?", "options": ["To meet data residency, compliance, or latency requirements", "To make the model larger automatically", "To remove the need for a prompt", "To disable responsible AI checks"], "correctAnswer": 0, "explanation": "Choosing a deployment region can address data residency rules, regulatory compliance, and latency for end users. Deployment configuration is part of identifying appropriate model deployment options on AI-901.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["deployment-options"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Region choice does not change a model's size.", "2": "A prompt is still required regardless of region.", "3": "Region selection does not disable responsible AI safeguards."}}, {"id": "azure-ai-901-069", "question": "What best describes the difference between extractive and abstractive summarization?", "options": ["Extractive selects key sentences from the source, while abstractive generates new wording", "Extractive translates text, while abstractive detects sentiment", "Extractive creates images, while abstractive creates audio", "There is no difference between them"], "correctAnswer": 0, "explanation": "Extractive summarization pulls the most important existing sentences from the text, whereas abstractive summarization generates new phrasing that paraphrases the content. Azure AI Language offers both styles.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["summarization"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Neither type translates text or detects sentiment; both summarize.", "2": "Summarization works on text, not creating images or audio.", "3": "They are genuinely different approaches to summarization."}}, {"id": "azure-ai-901-070", "question": "Which scenario best demonstrates an information extraction workload?", "options": ["Pulling vendor names and amounts out of thousands of PDF receipts automatically", "Generating a poem from a prompt", "Playing a synthesized voice greeting", "Brightening the colors in a photo"], "correctAnswer": 0, "explanation": "Automatically extracting structured fields like vendor names and amounts from documents is an information extraction workload, handled by Azure Content Understanding in Foundry. The other options are generative or editing tasks.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["document-extraction"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Generating a poem is a generative AI task, not extraction.", "2": "Playing a synthesized voice is speech synthesis, not extraction.", "3": "Brightening photo colors is image editing, not information extraction."}}, {"id": "azure-ai-901-071", "question": "When building an agent in Foundry, what does giving the agent clear instructions accomplish?", "options": ["It defines the agent's goal, behavior, and how it should use its tools", "It encrypts the network traffic", "It increases the Azure subscription quota", "It changes the billing currency"], "correctAnswer": 0, "explanation": "Instructions tell the agent what its objective is, how to behave, and when to use available tools. Clear instructions are essential for an agent to act reliably toward the intended goal.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["agent-instructions"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Instructions guide behavior; they do not encrypt traffic.", "2": "Agent instructions do not change subscription quotas.", "3": "Billing currency is account configuration, not an agent instruction."}}, {"id": "azure-ai-901-072", "question": "Which example best illustrates the inclusiveness principle in a deployed AI product?", "options": ["Adding voice control and screen-reader support so people with disabilities can use the app", "Limiting the app to one premium customer segment", "Hiding all documentation from users", "Storing data without any backup"], "correctAnswer": 0, "explanation": "Inclusiveness means designing AI so that everyone, including people with disabilities, can benefit. Adding accessibility features like voice control and screen-reader support directly supports this principle.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["inclusiveness"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Limiting access to one segment is the opposite of inclusiveness.", "2": "Hiding documentation reduces transparency and accessibility.", "3": "Skipping backups is a reliability issue, not inclusiveness."}}, {"id": "azure-ai-901-073", "question": "Which describes a key risk of generative AI that responsible AI practices aim to reduce?", "options": ["Generating biased, harmful, or false content", "Running out of disk space on a laptop", "Slow internet connections", "Using too many browser tabs"], "correctAnswer": 0, "explanation": "Generative models can produce biased, harmful, or factually incorrect content, so responsible AI practices like content filtering, grounding, and human oversight are applied to mitigate these risks. The other options are unrelated infrastructure or user issues.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["generative-ai-risks"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Disk space is a hardware concern, not a generative AI risk.", "2": "Slow internet is a connectivity issue, not an AI content risk.", "3": "Browser tab count is unrelated to responsible AI."}}, {"id": "azure-ai-901-074", "question": "In Foundry, what is the purpose of a connection within a project?", "options": ["To securely link the project to a resource or data source it needs", "To physically wire two servers together", "To change the model's temperature setting", "To create a new Azure tenant"], "correctAnswer": 0, "explanation": "A connection in a Foundry project securely links it to external resources or data, such as a storage account or another AI service, so the solution can use them. Connections centralize and protect credentials.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["foundry-connections"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Connections are logical links to resources, not physical cabling.", "2": "Temperature is a model parameter, not what a connection sets.", "3": "Creating a tenant is an identity operation, not a project connection."}}, {"id": "azure-ai-901-075", "question": "Predicting next month's electricity demand from years of historical readings is which kind of machine learning task?", "options": ["Regression (predicting a numeric value)", "Generative content creation", "Optical character recognition", "Speech synthesis"], "correctAnswer": 0, "explanation": "Predicting a continuous numeric value such as future demand is a regression task in machine learning. It differs from classification, which predicts categories, and from generative tasks that create new content.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["regression"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Generative content creation makes new media, not numeric forecasts.", "2": "OCR reads text from images, unrelated to demand prediction.", "3": "Speech synthesis creates audio, not numeric forecasts."}}, {"id": "azure-ai-901-076", "question": "Sorting emails into 'spam' or 'not spam' is which kind of machine learning task?", "options": ["Classification", "Regression", "Image generation", "Speech recognition"], "correctAnswer": 0, "explanation": "Assigning items to discrete categories such as spam or not spam is a classification task. Regression predicts numeric values, so it is not the right description here.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["classification"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Regression predicts numbers, not discrete spam categories.", "2": "Image generation creates pictures, unrelated to email sorting.", "3": "Speech recognition converts audio to text, not classifying emails."}}, {"id": "azure-ai-901-077", "question": "Which describes the relationship between AI, machine learning, and generative AI?", "options": ["Machine learning is a subset of AI, and generative AI is a subset of machine learning", "They are three completely unrelated fields", "Generative AI contains all of AI and machine learning", "Machine learning is broader than AI"], "correctAnswer": 0, "explanation": "Artificial intelligence is the broadest field, machine learning is a subset of AI that learns from data, and generative AI is a subset of machine learning focused on creating new content. Understanding these nested relationships is foundational.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["ai-ml-relationship"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "They are nested fields, not unrelated.", "2": "Generative AI is a subset, not a superset containing all of AI.", "3": "AI is broader than machine learning, not the reverse."}}, {"id": "azure-ai-901-078", "question": "A retailer wants an AI feature that recommends products by understanding the meaning of a shopper's search phrase, even with different wording. Which technique supports this?", "options": ["Semantic search using embeddings", "Optical character recognition", "Text to speech", "Object detection"], "correctAnswer": 0, "explanation": "Semantic search uses embeddings to match queries to results based on meaning rather than exact keywords, so different phrasings still find relevant products. This is a common application of embedding models.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["semantic-search"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "OCR reads text from images, not matching meaning of queries.", "2": "Text to speech , "2": "It supports, rather than eliminates, responsible AI principles.", "3": "It has nothing to do with reducing output to a single token."}}, {"id": "azure-ai-901-081", "question": "Which task is best suited to optical character recognition rather than a generative model?", "options": ["Digitizing the printed text on a stack of old paper forms", "Writing a creative short story", "Holding a back-and-forth conversation", "Designing a new company logo from a description"], "correctAnswer": 0, "explanation": "OCR is purpose-built to detect and read existing text from images and documents, making it ideal for digitizing paper forms. Story writing, conversation, and logo design are generative tasks.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["ocr"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Writing a story is a generative language task, not OCR.", "2": "Holding a conversation is a chat task, not text extraction.", "3": "Designing a logo from a description is image generation, not OCR."}}, {"id": "azure-ai-901-082", "question": "Which best describes speaker diarization in Azure AI Speech?", "options": ["Separating who spoke when in a transcript", "Translating speech into another language", "Generating images from speech", "Counting objects in a video"], "correctAnswer": 0, "explanation": "Speaker diarization, part of speech to text, separates the speakers in a transcript and labels them generically. It does not identify who they are; Azure Speaker Recognition, which verified or identified people by voice, was retired on September 30, 2025.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["azure-ai-speech"], "difficulty": "medium", "lastUpdated": "2026-10-28", "wrongExplanations": {"1": "Translating speech is speech translation, not separating speakers.", "2": "Generating images is unrelated to separating speakers.", "3": "Counting objects in video is a vision task, not speaker diarization."}}, {"id": "azure-ai-901-083", "question": "Which factor would NOT typically influence which generative model you choose for a task?", "options": ["The favorite color of the developer", "Whether the task needs vision or only text", "The cost and latency of the model", "The quality of the model's reasoning"], "correctAnswer": 0, "explanation": "Model selection should be based on capabilities, cost, latency, and quality relative to the task. A developer's favorite color is irrelevant and should never drive a model choice.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["model-selection"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Whether the task needs vision is a real, important selection factor.", "2": "Cost and latency are legitimate model-selection considerations.", "3": "Reasoning quality is a key factor in choosing a model."}}, {"id": "azure-ai-901-084", "question": "A developer builds an app that takes a product photo and returns a written description of it. Which capability is at the core of this app?", "options": ["Image analysis or captioning by a vision-capable model", "Speech translation", "Regression forecasting", "Speaker verification"], "correctAnswer": 0, "explanation": "Turning an image into a written description is image analysis or captioning, performed by a vision-capable or multimodal model. It interprets visual content and outputs descriptive text.", "exams": ["azure-ai-901"], "category": "computer-vision", "topics": ["image-captioning"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Speech translation works on audio, not images.", "2": "Regression forecasting predicts numbers, not image descriptions.", "3": "Speaker verification identifies voices, not describing images."}}, {"id": "azure-ai-901-085", "question": "Which statement about Foundry Tools such as Azure Speech and Content Understanding is correct?", "options": ["They provide specialized AI capabilities you can build into Foundry applications", "They are only available as physical hardware appliances", "They replace the need for an Azure account", "They can only process data from the year 1990"], "correctAnswer": 0, "explanation": "Foundry Tools, including Azure Speech and Content Understanding, offer specialized AI capabilities like speech processing and information extraction that developers integrate into their Foundry solutions. They are cloud services consumed through the platform.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["foundry-tools"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "These are cloud services, not physical hardware appliances.", "2": "They still require an Azure account to use.", "3": "There is no such date limitation on the data they process."}}, {"id": "azure-ai-901-086", "question": "What is the main advantage of zero-shot prompting?", "options": ["The model performs a task from instructions alone, without needing examples", "It permanently retrains the model", "It guarantees perfect output every time", "It removes the need for a deployed model"], "correctAnswer": 0, "explanation": "Zero-shot prompting asks the model to perform a task using only a clear instruction, with no examples provided. It is quick and simple, though few-shot prompting can improve results for harder or more specific tasks.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["prompt-engineering"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Prompting does not retrain the model; that is fine-tuning.", "2": "No prompting style guarantees perfect output every time.", "3": "A deployed model is still required to process any prompt."}}, {"id": "azure-ai-901-087", "question": "Which is a realistic example of an agentic AI solution built in Foundry?", "options": ["An assistant that checks a calendar tool and books a meeting
