nish", "Forecasting quarterly revenue"], "correctAnswer": 0, "explanation": "Reading labels and prices from shelf photos extracts structured information from images, which Content Understanding supports. Composing music, translating text, and forecasting revenue are different workloads entirely.", "exams": ["azure-ai-901"], "category": "information-extraction", "topics": ["image-extraction"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Composing music is a generative audio task, not image extraction.", "2": "Translating a webpage is an NLP task, not extracting from images.", "3": "Forecasting revenue is a predictive numeric task."}}, {"id": "azure-ai-901-090", "question": "What does it mean that AI-901 is currently in beta?", "options": ["The exam is newly released and its questions are being validated before final scoring", "The exam is free during this period", "The exam has no passing score", "The certification cannot be earned at all"], "correctAnswer": 0, "explanation": "A beta exam is newly launched while Microsoft validates question performance; scores may be reported after the beta period. Candidates can still take it and earn the certification once results are finalized.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["beta-exam"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Beta status does not make the exam free; the standard fee still applies.", "2": "The passing score of 700 still applies to AI-901.", "3": "The certification can be earned; beta scoring is finalized after the period."}}, {"id": "azure-ai-901-091", "question": "Which describes the difference between a base model and a fine-tuned model?", "options": ["A base model is general purpose, while a fine-tuned model is adapted to a specific task or domain", "A base model cannot generate any text", "A fine-tuned model is always smaller in file size", "There is no functional difference"], "correctAnswer": 0, "explanation": "A base model is pretrained for broad, general use, while fine-tuning adapts it with additional task- or domain-specific training data. Fine-tuning can improve performance on specialized tasks but is not always necessary.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["fine-tuning"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "A base model absolutely can generate text; that is its purpose.", "2": "Fine-tuning does not necessarily reduce file size.", "3": "There is a meaningful difference in specialization."}}, {"id": "azure-ai-901-092", "question": "An app must detect whether uploaded user images contain adult or violent content before publishing them. Which capability is the right choice?", "options": ["Azure AI Content Safety image moderation", "Text to speech", "Regression analysis", "Language detection"], "correctAnswer": 0, "explanation": "Azure AI Content Safety can analyze images and flag harmful categories such as adult or violent content, supporting safe publishing workflows. It is part of applying responsible AI safeguards to user-generated content.", "exams": ["azure-ai-901"], "category": "responsible-ai", "topics": ["content-safety"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Text to speech generates audio and cannot moderate images.", "2": "Regression analysis predicts numbers, not detecting harmful imagery.", "3": "Language detection identifies text language, not image content risks."}}, {"id": "azure-ai-901-093", "question": "Which is the most accurate description of how an agent decides to call a tool?", "options": ["The model reasons about the task and chooses to invoke a tool when it needs more information or an action", "Tools are always called in a fixed alphabetical order", "A human must manually trigger every tool call", "Tools are never used by agents"], "correctAnswer": 0, "explanation": "An agent's underlying model reasons about the goal and decides, based on the current state, when calling a tool will help it gather information or perform an action. This dynamic decision-making is what makes agents flexible.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["agent-tools"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Tool calls are decided by reasoning, not a fixed alphabetical order.", "2": "Agents can call tools autonomously without a human triggering each one.", "3": "Tool use is a defining feature of agents, so they do use tools."}}, {"id": "azure-ai-901-094", "question": "Which is a correct statement about how generative AI relates to traditional predictive machine learning?", "options": ["Generative AI creates new content, while traditional ML often predicts a label or value", "Generative AI and predictive ML are identical", "Traditional ML can only generate images", "Generative AI cannot use any training data"], "correctAnswer": 0, "explanation": "Generative AI focuses on producing new content such as text or images, whereas traditional predictive machine learning typically outputs a category or numeric prediction. Both learn from data but serve different goals.", "exams": ["azure-ai-901"], "category": "ai-concepts", "topics": ["generative-vs-predictive"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "They are not identical; their purposes differ.", "2": "Traditional ML predicts labels or values; it is not limited to generating images.", "3": "Generative AI is trained on large amounts of data."}}, {"id": "azure-ai-901-095", "question": "A team wants to test how changing the system prompt affects a chatbot's tone before deploying code. Where should they do this most efficiently?", "options": ["In the Foundry chat playground", "By editing the Azure billing settings", "By resizing the virtual network", "By changing their laptop wallpaper"], "correctAnswer": 0, "explanation": "The Foundry playground lets teams adjust the system prompt and immediately observe how the chatbot's responses and tone change, without writing application code. This rapid iteration is exactly what the playground is for.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["foundry-playground"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Billing settings do not affect prompt behavior testing.", "2": "Resizing a virtual network is unrelated to prompt iteration.", "3": "Wallpaper has no effect on chatbot tone."}}, {"id": "azure-ai-901-096", "question": "Which scenario best fits using speech translation?", "options": ["A traveler speaks English and the app speaks the translated phrase in Spanish", "An app counts cars in a traffic video", "A model writes a marketing slogan", "A system extracts totals from invoices"], "correctAnswer": 0, "explanation": "Speech translation converts spoken words from one language to another, ideal for real-time travel or conversation scenarios. Counting cars, writing slogans, and extracting invoice totals are vision, generative, and extraction tasks respectively.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["speech-translation"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Counting cars in video is a computer vision task.", "2": "Writing a slogan is a generative language task, not translation.", "3": "Extracting invoice totals is information extraction, not speech translation."}}, {"id": "azure-ai-901-097", "question": "Why should a developer monitor token usage when running a generative AI application?", "options": ["Tokens affect both cost and whether the input fits within the context window", "Tokens determine the screen resolution", "Tokens set the keyboard language", "Tokens control the operating system version"], "correctAnswer": 0, "explanation": "Token usage drives cost, since billing is often per token, and it determines whether prompts and responses fit within the model's context window. Monitoring tokens helps manage both budget and behavior.", "exams": ["azure-ai-901"], "category": "generative-ai", "topics": ["tokens"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Tokens have nothing to do with screen resolution.", "2": "Tokens do not set the keyboard language.", "3": "Tokens are unrelated to the operating system version."}}, {"id": "azure-ai-901-098", "question": "Which combination of capabilities would a customer-service voice bot most likely use?", "options": ["Speech to text, a generative model with grounding, and text to speech", "Only image generation", "Only OCR", "Only regression forecasting"], "correctAnswer": 0, "explanation": "A voice bot transcribes the caller with speech to text, generates a grounded answer with a model, and replies aloud with text to speech. Combining these capabilities creates a natural spoken support experience.", "exams": ["azure-ai-901"], "category": "generative-ai-apps", "topics": ["solution-design"], "difficulty": "hard", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Image generation alone cannot transcribe or speak to a caller.", "2": "OCR alone reads text from images and cannot run a voice conversation.", "3": "Regression forecasting predicts numbers and is not a voice bot capability."}}, {"id": "azure-ai-901-099", "question": "Which statement about the AI-901 exam format is correct?", "options": ["It is a multiple-choice exam delivered in about 45 minutes with roughly 40 to 60 questions", "It is an open-book essay exam lasting 8 hours", "It is a hands-on lab with no questions", "It is an oral interview with a Microsoft engineer"], "correctAnswer": 0, "explanation": "AI-901 is a multiple-choice fundamentals exam, typically around 45 minutes with roughly 40 to 60 questions. It does not include long essays, labs, or oral interviews.", "exams": ["azure-ai-901"], "category": "exam-logistics", "topics": ["exam-format"], "difficulty": "easy", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "It is not an 8-hour open-book essay exam.", "2": "There is no hands-on lab replacing the questions for AI-901.", "3": "It is not an oral interview."}}, {"id": "azure-ai-901-100", "question": "A developer wants the simplest path to add text analysis, like sentiment, to an app using Foundry. Which approach matches the AI-901 expectations?", "options": ["Build a lightweight application that calls a Foundry text-analysis capability", "Train a new language model from scratch on a personal computer", "Manually read and label every document by hand", "Avoid Foundry and write the analysis in spreadsheet formulas"], "correctAnswer": 0, "explanation": "AI-901 expects candidates to build lightweight applications that use Foundry capabilities such as text analysis, rather than training models from scratch. Calling a ready-made capability is the efficient, recommended path.", "exams": ["azure-ai-901"], "category": "natural-language-processing", "topics": ["text-analysis-app"], "difficulty": "medium", "lastUpdated": "2026-05-24", "wrongExplanations": {"1": "Training a language model from scratch is impractical and out of scope for fundamentals.", "2": "Manual labeling defeats the purpose of automating text analysis.", "3": "Spreadsheet formulas cannot perform genuine sentiment analysis."}}];
const KEY = "offline_progress:" + document.title;
const L = "ABCDEFGH";
let prog = JSON.parse(localStorage.getItem(KEY) || "{}"); // id -> chosen index
let list = [], idx = 0;
const $ = id => document.getElementById(id);
const cats = [...new Set(ALL.map(q => q.category))];
$("cat").innerHTML = '<option value="">Mọi chủ đề</option>' + cats.map(c => `<option>${c}</option>`).join("");
function save(){ localStorage.setItem(KEY, JSON.stringify(prog)); }
function build(){
  const c = $("cat").value, m = $("mode").value;
  list = ALL.filter(q => (!c || q.category === c) &&
    (m === "all" || (m === "new" && !(q.id in prog)) || (m === "missed" && q.id in prog && prog[q.id] !== q.correctAnswer)));
  idx = 0; render();
}
function render(){
  const done = ALL.filter(q => q.id in prog), ok = done.filter(q => prog[q.id] === q.correctAnswer);
  $("score").textContent = `Đúng ${ok.length}/${done.length} · đã làm ${done.length}/${ALL.length}`;
  if (!list.length){ $("meta").textContent = ""; $("q").textContent = "Không có câu hỏi nào."; $("opts").innerHTML = ""; $("exp").style.display = "none"; return; }
  const q = list[idx];
  $("meta").textContent = `Câu ${idx+1}/${list.length} · ${q.id} · ${q.category} · ${q.difficulty}`;
  $("q").textContent = q.question;
  $("opts").innerHTML = "";
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = `${L[i]}. ${o}`;
    b.onclick = () => { prog[q.id] = i; save(); render(); };
    $("opts").appendChild(b);
  });
  const exp = $("exp");
  if (q.id in prog){
    const btns = $("opts").children;
    btns[q.correctAnswer].classList.add("correct");
    if (prog[q.id] !== q.correctAnswer) btns[prog[q.id]].classList.add("wrong");
    exp.innerHTML = `<b>Đáp án: ${L[q.correctAnswer]}</b><br>`;
    exp.appendChild(document.createTextNode(q.explanation || ""));
    exp.style.display = "block";
  } else exp.style.display = "none";
}
$("prev").onclick = () => { if (idx > 0){ idx--; render(); } };
$("next").onclick = () => { if (idx < list.length - 1){ idx++; render(); } };
$("cat").onchange = $("mode").onchange = build;
$("shuffle").onclick = () => { for (let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [list[i], list[j]] = [list[j], list[i]]; } idx = 0; render(); };
$("reset").onclick = () => { if (confirm("Xoá toàn bộ tiến độ?")){ prog = {}; save(); build(); } };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
  else { const i = L.toLowerCase().indexOf(e.key.toLowerCase()); const b = $("opts").children[i]; if (i >= 0 && b) b.click(); }
});
build();
</script></body></html>
